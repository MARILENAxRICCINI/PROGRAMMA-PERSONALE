/* ---------- legge 104: 3 giorni di permesso al mese ---------- */
const MAX104 = 3;
function giorni104(e,ym){ return e.l104 ? e.l104.giorni.filter(d=>d.slice(0,7)===ym) : []; }
function giorni104Sett(e,mon){ const fine=addDays(mon,6); return e.l104 ? e.l104.giorni.filter(d=>d>=mon&&d<=fine) : []; }
function riepilogo104(e,ym){ const n=giorni104(e,ym).length, [y,m]=ym.split("-").map(Number), mese=MESI[m-1];
  return n>MAX104 ? `A ${mese} ha segnato ${n} giorni: ${n-MAX104} oltre i ${MAX104} previsti.` : n===MAX104 ? `A ${mese} ha già usato tutti i ${MAX104} giorni.` : `A ${mese} ha usato ${n} giorni su ${MAX104}: ne restano ${MAX104-n}.`; }
function ymShift(ym,n){ let [y,m]=ym.split("-").map(Number); m+=n; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return y+"-"+String(m).padStart(2,"0"); }
function ymLabel(ym){ const [y,m]=ym.split("-").map(Number); return MESI[m-1][0].toUpperCase()+MESI[m-1].slice(1)+" "+y; }
function ultimoGiorno(ym){ const [y,m]=ym.split("-").map(Number); return iso(new Date(y,m,0)); }
async function add104(e,d){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
  if(e.l104.giorni.includes(d)){ toast(e.nome+": "+fmtShort(d)+" è già segnato"); return; }
  const n=giorni104(e,d.slice(0,7)).length;
  if(n>=MAX104 && !(await chiedi(e.nome+" ha già usato "+n+" giorni di 104 a "+MESI[parseIso(d).getMonth()]+". Segnare lo stesso "+fmtLong(d)+"?",{titolo:"Oltre i "+MAX104+" giorni",ok:"Segna lo stesso"}))) return;
  e.l104.giorni.push(d); e.l104.giorni.sort(); saveAna(); render(); toast(e.nome+": 104 il "+fmtLong(d).toLowerCase());
}
function renderL104(){
  const oggiYm=isoToday().slice(0,7), ym=l104Mese||oggiYm, mon=mondayOf(curDate);
  const list=ana.dipendenti.filter(e=>e.l104).sort((a,b)=>a.nome.localeCompare(b.nome,"it",{sensitivity:"base"}));
  const altri=ana.dipendenti.filter(e=>!e.l104).sort((a,b)=>a.nome.localeCompare(b.nome,"it",{sensitivity:"base"}));
  const usati=list.reduce((t,e)=>t+giorni104(e,ym).length,0), oltre=list.filter(e=>giorni104(e,ym).length>MAX104).length;
  const sett=list.filter(e=>giorni104Sett(e,mon).length);
  const minD=ym+"-01", maxD=ultimoGiorno(ym);
  const defD = isoToday().slice(0,7)===ym ? isoToday() : curDate.slice(0,7)===ym ? curDate : minD;
  let h=`<div class="dayhead"><h1>Legge 104</h1><div class="stats"><span><b>${list.length}</b> ${list.length===1?"dipendente":"dipendenti"} con la 104</span><span>${MAX104} giorni di permesso al mese a testa</span><span><b>${usati}</b> giorni segnati a ${esc(MESI[Number(ym.slice(5))-1])}</span></div></div>
    <div class="filters"><div class="mnav"><button class="btn" id="m104p" aria-label="Mese precedente">‹</button><b>${esc(ymLabel(ym))}</b><button class="btn" id="m104n" aria-label="Mese successivo">›</button>${ym!==oggiYm?`<button class="btn" id="m104o">Mese in corso</button>`:`<span class="none">mese in corso</span>`}</div>
    <select id="add104e"><option value="">+ Aggiungi un dipendente con la 104</option>${altri.map(e=>`<option value="${e.id}">${esc(e.nome)}${repById(e.reparto)?" · "+esc(repName(e.reparto)):""}</option>`).join("")}</select></div>`;
  if(oltre) h+=`<div class="alert noprint">${oltre===1?"1 persona ha":oltre+" persone hanno"} segnato più di ${MAX104} giorni a ${esc(MESI[Number(ym.slice(5))-1])}.</div>`;
  if(sett.length) h+=`<div class="alert info noprint">Nella settimana dal ${esc(fmtDM(mon))}: ${sett.map(e=>`<b>${esc(e.nome)}</b> (${esc(giorni104Sett(e,mon).map(fmtShort).join(", "))})`).join(", ")}.</div>`;
  if(!list.length){ h+=`<div class="empty">Nessun dipendente ha ancora la 104. Sceglilo dal menu qui sopra oppure spunta “Ha la 104” nella sua scheda.</div>`; }
  else {
    h+=`<div class="cards l104">`;
    for(const e of list){
      const g=giorni104(e,ym), n=g.length, cls=n>MAX104?"over":n===MAX104?"full":"ok", t=turnoDi(e,mon);
      h+=`<article class="card" data-e="${e.id}"><div class="top"><b>${esc(e.nome)}</b><span class="cnt ${cls}">${n} / ${MAX104}</span></div>
        <div class="none" style="margin-top:-6px">${esc(repName(e.reparto))} · ${sqEff(e)==="G"?"turno unico":sqEff(e)?"squadra "+esc(sqEff(e)):"jolly"}${e.ruolo?" · "+esc(e.ruolo):""}${t?" · questa settimana "+esc(turnoName(t).toLowerCase()):""}</div>
        <div class="slots" title="${esc(riepilogo104(e,ym))}">${Array.from({length:Math.max(MAX104,n)},(_,i)=>`<i class="${i>=MAX104?"x":i<n?"u":""}"></i>`).join("")}</div>
        <div class="lab" style="margin-bottom:-4px">${n? "Giorni usati" : "Nessun giorno usato a "+esc(MESI[Number(ym.slice(5))-1])+": ne restano "+MAX104}</div>
        ${n?`<div class="gg">${g.map(d=>`<span class="g ${giorni104Sett(e,mon).includes(d)?"inwk":""}" ${giorni104Sett(e,mon).includes(d)?'title="Nella settimana che stai guardando"':""}>${esc(fmtShort(d))}<button data-del104="${e.id}|${d}" aria-label="Togli ${esc(fmtLong(d))}">×</button></span>`).join("")}</div>`:""}
        <div class="add"><input type="date" data-d104="${e.id}" value="${defD}" min="${minD}" max="${maxD}" aria-label="Giorno di 104 per ${esc(e.nome)}"><button class="btn small" data-a104="${e.id}">Segna giorno</button></div>
        <div style="display:flex;gap:6px"><button class="btn small" data-open="${e.id}">Apri scheda</button><button class="btn small" data-rm104="${e.id}" style="margin-left:auto">Togli la 104</button></div></article>`;
    }
    h+=`</div>`;
  }
  $("main").innerHTML=h;
  $("m104p").onclick=()=>{ l104Mese=ymShift(ym,-1); renderL104(); };
  $("m104n").onclick=()=>{ l104Mese=ymShift(ym,1); renderL104(); };
  if($("m104o")) $("m104o").onclick=()=>{ l104Mese=""; renderL104(); };
  $("add104e").onchange=ev=>{ const e=empById(ev.target.value); if(!e) return; e.l104={giorni:[]}; saveAna(); renderL104(); toast(e.nome+" aggiunto alla 104"); };
  document.querySelectorAll("[data-a104]").forEach(b=>b.onclick=()=>{ const e=empById(b.dataset.a104), inp=document.querySelector(`[data-d104="${b.dataset.a104}"]`); add104(e,inp.value); });
  document.querySelectorAll("[data-del104]").forEach(b=>b.onclick=()=>{ const [id,d]=b.dataset.del104.split("|"), e=empById(id); e.l104.giorni=e.l104.giorni.filter(x=>x!==d); saveAna(); render(); toast(e.nome+": tolto il "+fmtShort(d)); });
  document.querySelectorAll("[data-rm104]").forEach(b=>b.onclick=async()=>{ const e=empById(b.dataset.rm104);
    if(!(await chiedi(e.nome+" non comparirà più in questa scheda"+(e.l104.giorni.length?" e i giorni già segnati verranno cancellati":"")+".",{titolo:"Togliere la 104?",ok:"Togli"}))) return;
    e.l104=null; saveAna(); render(); });
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openEmp(b.dataset.open));
}

/* ---------- vista schede ---------- */
function renderSchede(){
  const q=schedeQ.toLowerCase();
  const list=ana.dipendenti.filter(e=>(!q||e.nome.toLowerCase().includes(q)||(e.ruolo||"").toLowerCase().includes(q))
      && (!schedeRep || (schedeRep==="__none" ? !repById(e.reparto) : e.reparto===schedeRep))
      && (!schedeSq || (schedeSq==="__none" ? !sqEff(e) : sqEff(e)===schedeSq)))
    .sort((a,b)=>a.nome.localeCompare(b.nome,"it",{sensitivity:"base"}));
  let h=`<div class="dayhead"><h1>Schede dipendenti</h1><div class="stats"><span>presenze della settimana dal <b>${esc(fmtDM(mondayOf(curDate)))}</b></span></div></div>`+banner()+

    ana.dipendenti.push(e); schedeQ=""; schedeRep=""; schedeSq=""; saveAna(); renderSchede(); openEmp(e.id);
    setTimeout(()=>{ const n=$("enome"); if(n){ n.focus(); n.select(); } },30); };
  document.querySelectorAll(".card[data-e]").forEach(card=>{

  document.querySelectorAll("[data-pres]").forEach(c=>c.onchange=()=>{ if(c.checked) setPresent(c.dataset.pres); else { c.checked=true; openEmp(c.dataset.pres,true); } });

/* ---------- esporta / importa ---------- */
async function esporta(){
  try{
    const giorni={}; for(const [id,d] of await backend.listDays()) giorni[id]=d;
    const settimane={}; for(const [id,d] of await backend.listWeeks()) settimane[id]=d;
    const text=JSON.stringify({app:"distribuzione-personale", versione:3, esportato:new Date().toISOString(), anagrafica:ana, giorni, settimane}, null, 2);
    const name="programma-personale-"+isoToday()+".json";
    if(downloadsCap){
      try{ await downloadsCap.save({filename:name, data:text}); toast("File esportato"); }
      catch(e){ toast(e&&e.code==="declined" ? "Esportazione annullata" : "Esportazione non riuscita"); }
      return;
    }
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"application/json"})); a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast("File esportato");
  }catch(e){ toast("Esportazione non riuscita"); }
}
function importa(file){
  if(!file) return;
  const fr=new FileReader();
  fr.onload=async()=>{
    let d; try{ d=JSON.parse(fr.result); }catch(e){ toast("Il file non è un JSON valido"); return; }
    if(!d || !d.anagrafica || !Array.isArray(d.anagrafica.dipendenti)){ toast("Il file non contiene un’anagrafica di questo programma"); return; }
    const giorni=Object.entries(d.giorni||{}).filter(([k])=>/^\d{4}-\d{2}-\d{2}$/.test(k));
    const sett=Object.entries(d.settimane||{}).filter(([k])=>/^\d{4}-\d{2}-\d{2}$/.test(k));
    if(!(await chiedi("L’anagrafica attuale viene sostituita con quella del file ("+d.anagrafica.dipendenti.length+" dipendenti) e vengono caricate "+giorni.length+" giornate.",{titolo:"Importare i dati?",ok:"Importa",danger:true}))) return;
    ana=normAna(d.anagrafica); saveAna();
    for(const [k,v] of giorni) save(dayPath(k), normDay(v));
    for(const [k,v] of sett) save(weekPath(k), normWeek(v));
    subscribeDay(); subscribeWeekIfNeeded(true); render(); toast("Dati importati");
  };
  fr.readAsText(file);
}
// Incolla da Excel: colonne Nome, Reparto, Squadra, Ruolo (separate da tabulazione o ;)
function importaElenco(text){
  const lines=String(text||"").split(/\r?\n/).map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim());
  let agg=0, nuovi=0; const repKo=new Set(), sqKo=new Set();
  const findRep=s=>{ const n=normStr(s); if(!n) return ""; let r=ana.reparti.find(x=>normStr(x.nome)===n) || ana.reparti.find(x=>normStr(x.nome).startsWith(n)) || ana.reparti.find(x=>n.startsWith(normStr(x.nome))); return r? r.id : null; };
  const findSq=s=>{ const n=normStr(s).toUpperCase(); if(!n) return ""; const m=n.match(/^(?:SQUADRA\s*)?([ABC])$/); if(m) return m[1];
    if(n==="G"||n.startsWith("GIORN")||n.startsWith("UNICO")||n.startsWith("TURNO UNICO")||n.startsWith("NON IN SQUADRA")) return "G"; return null; };
  let hdrMap=null;   // colonne dei reparti "Anche in": dalla riga di intestazione se presente, altrimenti nell'ordine dei reparti
  lines.forEach((l,i)=>{
    const c=(l.includes("\t")? l.split("\t") : l.includes(";")? l.split(";") : l.split(",")).map(x=>x.trim());
    if(i===0 && /^nome|^cognome|^nominativo/i.test(c[0])){
      hdrMap={}; c.forEach((h,k)=>{ if(k>=4){ const r=findRep(h.replace(/^anche in\s*[:\-]?\s*/i,"")); if(r) hdrMap[k]=r; } });
      if(!Object.keys(hdrMap).length) hdrMap=null;
      return;
    }
    const nome=c[0]; if(!nome) return;
    let e=ana.dipendenti.find(x=>normStr(x.nome)===normStr(nome));
    if(!e){ e={id:uid("e"),nome,reparto:"",squadra:"",ruolo:"",competenze:[],note:""}; ana.dipendenti.push(e); nuovi++; } else agg++;
    if(c[1]){ const r=findRep(c[1]); if(r===null) repKo.add(c[1]); else { e.reparto=r; e.competenze=e.competenze.filter(x=>x!==r); } }
    if(c[2]){ const s=findSq(c[2]); if(s===null) sqKo.add(c[2]); else e.squadra=s; }
    if(c[3]!==undefined && c[3]!=="") e.ruolo=c[3];
    if(c.length>4){   // colonne "Anche in": una per reparto, segnata con X
      const comp=[];
      c.forEach((v,k)=>{ if(k<4 || !/^(x|si|sì|1|s|ok|v)$/i.test(v)) return;
        const r = hdrMap ? hdrMap[k] : (ana.reparti[k-4]||{}).id; if(r && r!==e.reparto && !comp.includes(r)) comp.push(r); });
      e.competenze=comp;
    }
  });
  saveAna(); renderAna();
  const msg=[agg+" aggiornati", nuovi+" aggiunti"]; if(repKo.size) msg.push("reparto non riconosciuto: "+[...repKo].slice(0,4).join(", ")); if(sqKo.size) msg.push("squadra non riconosciuta: "+[...sqKo].slice(0,4).join(", "));
  toast(msg.join(" · "));
}

/* ---------- vista impostazioni (ex anagrafica): reparti, turni e dati; le persone stanno nelle Schede ---------- */
function renderAna(){
  let h=`<div class="dayhead"><h1>Impostazioni</h1><div class="stats"><span>reparti, turni e dati del programma · le persone si gestiscono nelle <a href="#schede">Schede</a></span></div></div>
    <section class="panel"><div class="h"><b>Dati</b><button class="btn small" id="exp">Esporta in un file</button><label class="btn small" style="cursor:pointer">Importa da un file<input type="file" id="imp" accept=".json,application/json" hidden></label></div>
    <div class="hint">${backend.kind==="db"?"I dati sono condivisi tra chi apre questa pagina in Claude.":backend.kind==="firebase"?"I dati sono su Firebase e condivisi tra i colleghi autorizzati.":"I dati sono salvati solo in questo browser."} Il file esportato contiene anagrafica, giornate e settimane: serve come copia di sicurezza e per passare i dati tra la versione in Claude e quella aperta altrove.</div></section>
    <section class="panel"><div class="h"><b>Incolla elenco da Excel</b><button class="btn small primary" id="pasteGo">Applica</button></div>
    <div class="hint">Incolla qui le colonne <b>Nome · Reparto · Squadra · Ruolo</b> e, se ci sono, le colonne <b>Anche in</b> (una per reparto, segnata con X) copiate da Excel o dal modello. Se incolli anche la riga di intestazione, i reparti vengono riconosciuti dai titoli. Le persone già presenti vengono aggiornate, quelle nuove aggiunte. Squadra: A, B, C oppure G (turno unico giornaliero, non in squadra).</div>
    <div style="padding:0 12px 12px"><textarea id="paste" rows="4" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)" placeholder="AYAT B.	Polier	A	Operatore"></textarea></div></section>
    <section class="panel"><div class="h"><b>Reparti</b><button class="btn small primary" id="addRep">Aggiungi reparto</button></div>
    <div class="scroll"><table><thead><tr><th>Nome</th><th>Turno unico giornaliero</th><th>Turni decisi ogni settimana</th><th>Ruoli in ogni turno</th><th>Minimo per turno</th><th>Notte anche da altre squadre</th>${ana.turni.map(t=>`<th>Standard ${esc(t.nome.toLowerCase())}</th>`).join("")}<th>Dipendenti</th><th></th></tr></thead><tbody>`+
    ana.reparti.map(r=>{ const n=ana.dipendenti.filter(e=>e.reparto===r.id).length;
      return `<tr data-r="${r.id}"><td><input type="text" data-f="nome" value="${esc(r.nome)}"></td><td><input type="checkbox" data-giorn ${r.giornaliero?"checked":""} aria-label="Turno unico giornaliero"></td><td><input type="checkbox" data-tvar ${r.turniVariabili?"checked":""} ${r.giornaliero?"disabled":""} aria-label="Turni decisi ogni settimana"></td><td style="white-space:nowrap">${Object.entries(RUOLI).map(([k,x])=>`<label style="display:block;font-size:12.5px"><input type="checkbox" data-ruo="${k}" ${r.ruoli.includes(k)?"checked":""} ${r.giornaliero?"disabled":""}> ${esc(x.l)}</label>`).join("")}</td><td><input type="number" min="0" max="9" data-mint value="${r.minTurno||0}" ${r.giornaliero?"disabled":""} aria-label="Minimo per turno"></td><td><input type="checkbox" data-notte ${r.notteAltreSquadre?"checked":""} ${r.giornaliero?"disabled":""} aria-label="Notte anche da altre squadre"></td>`+
        ana.turni.map(t=>`<td><input type="number" min="0" data-std="${t.id}" value="${r.std[t.id]||0}" ${turnoApplicabile(r,t.id)?"":"disabled"}></td>`).join("")+
        `<td>${n}</td><td><button class="btn small danger" data-delrep="${r.id}" ${n?"disabled title='Cambia prima il reparto principale dei dipendenti'":""}>Elimina</button></td></tr>`;}).join("")+
    `</tbody></table></div><div class="hint">Lo standard è il numero di persone che servono normalmente in ogni turno: viene proposto ogni settimana nel fabbisogno e puoi cambiarlo settimana per settimana nella vista Settimana. Nei reparti a turno unico giornaliero (Manutenzione, Magazzino) contano solo i giornalieri e tutte le persone del reparto sono fuori squadra. Nei reparti con i <b>turni decisi ogni settimana</b> (Reparto 5, Granulazione) si sceglie nella vista Settimana se lavorano su 1 turno (mattina), 2 (mattina e pomeriggio) o 3: gli altri reparti lavorano sempre su tutti e tre. Se un turno scelto ha standard 0, servono quante persone del turno più numeroso. <b>Ruoli in ogni turno</b>: il programma mette in ogni turno una persona per ciascun ruolo spuntato, nell’ordine dell’elenco e finché bastano i posti (con 2 posti al Kingcor: capoturno e I operatore imballaggio), e segnala dove non ci riesce. Il ruolo si legge da “Ruolo in reparto” della scheda. <b>Minimo per turno</b>: in ogni turno in cui il reparto lavora servono almeno tante persone. <b>Notte anche da altre squadre</b>: se di notte manca qualcuno (per esempio il capoturno, che non fa la notte) il programma può prendere una persona abilitata di un’altra squadra, anche fuori dalla rotazione.</div></section>`;

  h+=`<section class="panel"><div class="h"><b>Turni</b></div>
    <div class="scroll"><table style="min-width:420px"><thead><tr><th>Turno</th><th>Orario</th></tr></thead><tbody>`+
    ana.turni.map(t=>`<tr data-t="${t.id}"><td>${esc(t.nome)}</td><td><input type="text" data-f="orario" value="${esc(t.orario||"")}" placeholder="es. 08–17"></td></tr>`).join("")+
    `</tbody></table></div><div class="hint">Le squadre A, B e C fanno mattina, pomeriggio e notte e ruotano ogni settimana (si imposta nella scheda Settimana). Il turno giornaliero è quello di chi non è in squadra.</div>
    <div class="hint">Il programma della settimana dopo si prepara il <select id="prepDow" style="border:1px solid var(--line);border-radius:5px;padding:2px 6px;background:var(--bg)">${[[4,"giovedì"],[5,"venerdì"],[6,"sabato"]].map(([v,l])=>`<option value="${v}" ${ana.prepDow===v?"selected":""}>${l}</option>`).join("")}</select>: da quel giorno il programma si apre già sulla settimana successiva.</div></section>`;

  $("main").innerHTML=h;

  $("exp").onclick=esporta;
  $("prepDow").onchange=ev=>{ ana.prepDow=parseInt(ev.target.value,10)||5; saveAna(); toast("Giorno di preparazione salvato"); };
  $("imp").onchange=ev=>{ importa(ev.target.files[0]); ev.target.value=""; };
  $("pasteGo").onclick=()=>{ const v=$("paste").value; if(!v.trim()){ toast("Incolla prima l’elenco"); return; } importaElenco(v); };
  $("addRep").onclick=()=>{ ana.reparti.push({id:uid("r"),nome:"Nuovo reparto",giornaliero:false,std:{}}); saveAna(); renderAna(); };
  document.querySelectorAll("tr[data-r] [data-f]").forEach(inp=>inp.onchange=()=>{ const r=repById(inp.closest("tr").dataset.r); r.nome=inp.value.trim()||r.nome; saveAna(); renderAna(); });
  document.querySelectorAll("tr[data-r] [data-giorn]").forEach(c=>c.onchange=()=>{
    const r=repById(c.closest("tr").dataset.r); r.giornaliero=c.checked;
    if(c.checked){ const s=(r.std.mattina||0)+(r.std.pomeriggio||0)+(r.std.notte||0); if(!r.std[GIORN]) r.std[GIORN]=s; ORD.forEach(t=>r.std[t]=0); }
    saveAna(); renderAna(); });
  document.querySelectorAll("tr[data-r] [data-ruo]").forEach(c=>c.onchange=()=>{ const r=repById(c.closest("tr").dataset.r), k=c.dataset.ruo;
    r.ruoli=Object.keys(RUOLI).filter(x=>x===k? c.checked : r.ruoli.includes(x)); saveAna(); renderAna(); });
  document.querySelectorAll("tr[data-r] [data-mint]").forEach(c=>c.onchange=()=>{ const r=repById(c.closest("tr").dataset.r); r.minTurno=Math.max(0,parseInt(c.value,10)||0); saveAna(); });
  document.querySelectorAll("tr[data-r] [data-notte]").forEach(c=>c.onchange=()=>{ const r=repById(c.closest("tr").dataset.r); r.notteAltreSquadre=c.checked; saveAna(); });
  document.querySelectorAll("tr[data-r] [data-tvar]").forEach(c=>c.onchange=()=>{ const r=repById(c.closest("tr").dataset.r); r.turniVariabili=c.checked; saveAna(); renderAna(); });
  document.querySelectorAll("tr[data-r] [data-std]").forEach(inp=>inp.onchange=()=>{ const r=repById(inp.closest("tr").dataset.r); r.std[inp.dataset.std]=Math.max(0,parseInt(inp.value,10)||0); saveAna(); });
  document.querySelectorAll("tr[data-t] [data-f]").forEach(inp=>inp.onchange=()=>{ const t=turnoById(inp.closest("tr").dataset.t); t.orario=inp.value.trim(); saveAna(); });
  document.querySelectorAll("[data-delrep]").forEach(b=>b.onclick=async()=>{
    const r=repById(b.dataset.delrep); if(!(await chiedi("Il reparto viene tolto anche dalle abilitazioni dei dipendenti.",{titolo:"Eliminare "+r.nome+"?",ok:"Elimina",danger:true}))) return;
    ana.reparti=ana.reparti.filter(x=>x.id!==r.id); ana.dipendenti.forEach(e=>e.competenze=e.competenze.filter(c=>c!==r.id)); saveAna(); renderAna();
  });
}

/* ---------- stampa: modulo "PROGRAMMA PERSONALE" (MOD. 80) ----------
   Il foglio è una lista di caselle in millimetri (A4 verticale), disegnata due volte con le stesse
   regole: in SVG per l'anteprima e la stampa dal browser, con jsPDF per il file PDF.

function isoWeek(s){ const d=parseIso(s); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const w1=new Date(d.getFullYear(),0,4);

function mk(s){ return String(s).split("\n").map(line=>{ const segs=[], re=/\*\*([^*]+)\*\*|\*([^*]+)\*|_([^_]+)_|([^*_]+)/g; let m;
  while((m=re.exec(line))){ if(m[1]) segs.push({s:m[1],b:1}); else if(m[2]) segs.push({s:m[2],b:1,i:1}); else if(m[3]) segs.push({s:m[3],i:1}); else segs.push({s:m[4]}); }
  return segs.length?segs:[{s:""}]; }); }

function datiStampa(mon,days,dd){
  const pos={}; ana.dipendenti.forEach(e=>pos[e.id]={});

    st.senza.forEach(e=>pos[e.id][d]={k:"S"});
    for(const r in st.slots) for(const t in st.slots[r]) st.slots[r][t].forEach(e=>pos[e.id][d]={k:r+"|"+t, rep:r, t}); }
  const reps={}, rp=id=>reps[id]||(reps[id]={rows:{},giorn:[],nt:[],ris:[],abs:{},chg:[]});
  const ab=["lun","mar","mer","gio","ven"];
  const giorniTxt=idx=>{ const out=[]; let i=0; while(i<idx.length){ let j=i; while(j+1<idx.length&&idx[j+1]===idx[j]+1) j++;
      out.push(j>i+1? ab[idx[i]]+"–"+ab[idx[j]] : j===i+1? ab[idx[i]]+", "+ab[idx[j]] : ab[idx[i]]); i=j+1; } return out.join(", "); };
  for(const e of ana.dipendenti){
    const p=pos[e.id], cnt={}; let best=null;
    days.forEach(d=>{ const x=p[d]; if(!x||x.ass) return; cnt[x.k]=(cnt[x.k]||0)+1; if(!best||cnt[x.k]>cnt[best.k]) best=x; });
    const home=repById(e.reparto)? e.reparto : null, wr=best&&best.rep ? best.rep : home;
    if(best && best.rep){ const r=rp(best.rep);
      if(best.t===NOTURNO) r.nt.push(e); else if(best.t===GIORN) r.giorn.push(e); else (r.rows[best.t]=r.rows[best.t]||[]).push(e); }
    else if(best && best.k==="R" && home) rp(home).ris.push(e);
    if(!wr) continue;
    const abs={}; days.forEach((d,i)=>{ const x=p[d]; if(x&&x.ass) (abs[x.ass]=abs[x.ass]||[]).push(i); });
    for(const [tp,idx] of Object.entries(abs)){ const m=rp(wr).abs; const nt=(p[days[idx[0]]]||{}).nota; (m[tp]=m[tp]||[]).push(e.nome+(idx.length===days.length?"":" ("+giorniTxt(idx)+")")+(nt?" ("+nt+")":"")); }
    if(best){ const it=[];
      days.forEach((d,i)=>{ const x=p[d]; if(!x||x.ass||x.k===best.k) return;
        it.push(ab[i]+" "+(x.k==="R"?"non utilizzato":x.k==="S"?"senza reparto":(x.rep!==wr?repName(x.rep)+" ":"")+(x.t===NOTURNO?"da assegnare":turnoName(x.t).toLowerCase()))); });

  for(const id in reps){ const r=reps[id]; Object.values(r.rows).forEach(l=>l.sort(byName)); r.giorn.sort(byName); }
  return reps;
}

// sistema le persone di una riga nelle colonne del loro ruolo; chi non ha ruolo va nella prima colonna libera
function fillCols(list,cols){
  const cells=cols.map(()=>[]), rest=[], lastAuto=cols.map(c=>!!c.auto).lastIndexOf(true);
  for(const e of list){ const r=normStr(e.ruolo), j=cols.findIndex(c=>c.m&&c.m.test(r)); if(j>=0&&!cells[j].length) cells[j].push(e); else rest.push({e,j}); }
  for(const {e,j} of rest){ let k=cols.findIndex((c,i)=>c.auto&&!cells[i].length); if(k<0) k= j>=0? j : (lastAuto>=0?lastAuto:0); cells[k].push(e); }
  return cells;
}
// separa i giornalieri: responsabile, attrezzista, altri
function intestazione(r,lay){
  const o={resp:[],attr:[],altri:[]}; if(!r) return o;

  return o;
}

/* --- impaginazione del testo dentro una casella --- */
function fitBox(bx,measure){
  const lines = bx.lab!=null ? mk(bx.lab) : bx.txt ? plain(bx.txt) : null;
  if(!lines) return null;
  const pad=1.1, W=bx.w-2*pad, H=bx.h-0.5, min=bx.min||5;
  const lw=(segs,f)=>segs.reduce((a,g)=>a+measure(g.s,f,g.b,g.i),0);
  for(let fs=bx.fs||(bx.lab!=null?FS_LAB:FS_NAME);;fs-=0.25){
    let out=lines;
    if(bx.wrap){ out=[]; for(const segs of lines){ const st=segs[0], words=segs.map(g=>g.s).join("").split(/ +/); let cur="";
        for(const w of words){ const t=cur?cur+" "+w:w; if(cur && measure(t,fs,st.b,st.i)>W){ out.push([{b:st.b,i:st.i,s:cur}]); cur=w; } else cur=t; }
        out.push([{b:st.b,i:st.i,s:cur}]); } }
    const lh=fs*MM*1.13;
    const ok = out.length*lh<=H && out.every(s=>lw(s,fs)<=W);
    if(ok) return {fs,lines:out,lh};
    if(fs<=min){
      const maxL=Math.max(1,Math.floor(H/lh)), cut=out.length>maxL;
      out=out.slice(0,maxL).map(s=>s.map(g=>Object.assign({},g)));
      if(cut){ const L=out[out.length-1]; L[L.length-1].s+=" …"; }
      out.forEach(s=>{ const g=s[s.length-1]; while(lw(s,fs)>W && g.s.length>2) g.s=g.s.replace(/ ?…$/,"").slice(0,-1)+"…"; });
      return {fs,lines:out,lh};
    }
  }
}
function linePos(bx,f,k,width){
  const total=f.lines.length*f.lh, top=bx.y+(bx.h-total)/2, base=top+f.lh*(k+0.5)+f.fs*MM*0.35;
  const al=bx.al||(bx.lab!=null?"c":"l");
  return {x: al==="c"? bx.x+bx.w/2-width/2 : al==="r"? bx.x+bx.w-1.1-width : bx.x+1.1, base};
}
function svgSheet(B){
  const cv=svgSheet.cv||(svgSheet.cv=document.createElement("canvas").getContext("2d"));
  const meas=(s,f,b,i)=>{ cv.font=(i?"italic ":"")+(b?"bold ":"")+f+"pt Helvetica, Arial, 'Liberation Sans', sans-serif"; return cv.measureText(s).width*25.4/96; };
  let fills="", txt="", lines="";
  for(const bx of B){
    if(bx.fill) fills+=`<rect x="${bx.x}" y="${bx.y}" width="${bx.w}" height="${bx.h}" fill="${bx.fill}"/>`;
    if(bx.img) fills+=`<image href="${bx.img}" x="${bx.x}" y="${bx.y}" width="${bx.w}" height="${bx.h}" preserveAspectRatio="xMidYMid meet"/>`;
    const f=fitBox(bx,meas);
    if(f) f.lines.forEach((segs,k)=>{ const w=segs.reduce((a,g)=>a+meas(g.s,f.fs,g.b,g.i),0), p=linePos(bx,f,k,w);
      txt+=`<text x="${p.x.toFixed(2)}" y="${p.base.toFixed(2)}" font-size="${(f.fs*MM).toFixed(3)}">`+segs.map(g=>`<tspan${g.b?' font-weight="bold"':""}${g.i?' font-style="italic"':""}>${esc(g.s)}</tspan>`).join("")+`</text>`; });
    if(bx.lw) lines+=`<rect x="${bx.x}" y="${bx.y}" width="${bx.w}" height="${bx.h}" fill="none" stroke="#000" stroke-width="${bx.lw}"/>`;
  }

}
function pdfSheet(doc,B){
  const style=(b,i)=>b&&i?"bolditalic":b?"bold":i?"italic":"normal";
  const meas=(s,f,b,i)=>{ doc.setFont("helvetica",style(b,i)); doc.setFontSize(f); return doc.getTextWidth(s); };

      for(const g of segs){ doc.setFont("helvetica",style(g.b,g.i)); doc.setFontSize(f.fs); if(g.s) doc.text(g.s,x,base); x+=doc.getTextWidth(g.s); } }); }
  doc.setDrawColor(0,0,0);

}

function wGriglia(cells,frames){
  const eps=0.05, uniq=a=>[...new Set(a.map(v=>Math.round(v*100)/100))].sort((p,q)=>p-q);
  const xs=uniq(cells.flatMap(b=>[b.x,b.x+b.w])), ys=uniq(cells.flatMap(b=>[b.y,b.y+b.h]));
  const near=(a,b)=>Math.abs(a-b)<eps, inR=(v,a,b)=>v>a-eps&&v<b+eps;

  loginState=[msg,conEsci];
  $("main").innerHTML=`<div class="login"><h1>Programma settimanale personale</h1><p>Entra con il tuo account Google. Possono usare il programma solo i colleghi autorizzati.</p>
    ${conEsci?`<button class="btn" id="loginEsci">Esci ed entra con un altro account</button>`:`<button class="btn primary gbtn" id="loginGo"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Accedi con Google</button>`}
    ${msg?`<div class="err">${esc(msg)}</div>`:""}</div>`;
  if($("loginGo")) $("loginGo").onclick=async()=>{ const auth=firebase.auth(), pr=new firebase.auth.GoogleAuthProvider(); pr.setCustomParameters({prompt:"select_account"});
    try{ await auth.signInWithPopup(pr); }
    catch(e){ if(e && /popup-blocked|operation-not-supported/.test(e.code||"")) auth.signInWithRedirect(pr);
      else if(!(e && /popup-closed|cancelled-popup/.test(e.code||""))) schermataAccesso("Accesso non riuscito"+(e&&e.code?" ("+e.code+")":"")+"."); } };
  if($("loginEsci")) $("loginEsci").onclick=()=>firebase.auth().signOut();
}
async function avviaFirebase(){
  setSync("Connessione a Firebase…");
  try{
    if(!window.FIREBASE_CONFIG) await loadScript("firebase-config.js").catch(()=>{});
    const cf=window.FIREBASE_CONFIG; if(!(cf && cf.apiKey && cf.projectId && !/INCOLLA/.test(cf.apiKey+cf.projectId))) return false;   // configurazione mancante o non compilata
    for(const m of ["app","auth","firestore"]) await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
  }catch(e){ $("main").innerHTML=`<div class="empty">Non riesco a caricare Firebase: controlla la connessione e ricarica la pagina.</div>`; return true; }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth=firebase.auth();
  auth.getRedirectResult().catch(e=>schermataAccesso("Accesso non riuscito"+(e&&e.code?" ("+e.code+")":"")+"."));
  $("esci").onclick=()=>auth.signOut();
  auth.onAuthStateChanged(u=>{
    if(!u){ fbUser=null; scollega(); $("utente").hidden=true; setSync("Non collegato"); schermataAccesso(); return; }
    if(fbUser && fbUser.uid===u.uid && backend) return;
    fbUser=u; $("uemail").textContent=u.email||""; $("utente").hidden=false;
    backend=makeDbBackend(firebase.firestore(),"firebase");
    setSync("Collegato: dati condivisi");
    collega();
  });
  return true;
}
async function start(){
  let db=null;
  try{ if(window.claude && typeof window.claude.use==="function") db=await window.claude.use("db"); }catch(e){ db=null; }
  if(db){
    backend=makeDbBackend(db,"db"); setSync("Collegato: dati condivisi");
    try{ downloadsCap=await window.claude.use("downloads"); }catch(e){ downloadsCap=null; }
    try{ const user=await window.claude.use("user"); if(user && typeof user.can==="function"){ const c=await user.can("data.write"); if(c===false){ readOnly=true; setSync("Sola consultazione"); } } }catch(e){}
    collega(); return;
  }
  if(!window.claude && await avviaFirebase()) return;
  backend=makeLocalBackend(); setSync("Dati salvati solo su questo browser"); collega();
}
route();
start();
})();
</script>
