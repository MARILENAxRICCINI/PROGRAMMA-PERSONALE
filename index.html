<!DOCTYPE html>
<!--
  PROGRAMMA SETTIMANALE PERSONALE REPARTI - file unico HTML/CSS/JS, senza librerie.
  Il programma va dal lunedì ore 06:00 al sabato ore 06:00 (5 giorni di turno: lun-ven).
  Struttura dei dati (salvati come JSON):
    dati/anagrafica  = { versione:4, prepDow:4|5|6 (giorno in cui si prepara la settimana dopo),
                         reparti:[{id,nome,giornaliero,std:{idTurno:numero}}],
                         turni:[{id,nome,orario}]   // mattina, pomeriggio, notte, giornaliero
                         rotazione:{rif:"AAAA-MM-GG (un lunedì)", A:idTurno, passo:1|2},
                         dipendenti:[{id,nome,reparto,squadra:"A"|"B"|"C"|"G"|"",ruolo,competenze:[idReparto],noTurni:[idTurno],sqPref:"A"|"B"|"C"|"",coppie:{idReparto:[idDip]},malattia:{dal,fino}|null,note}] }   // malattia: assente in ogni settimana tra dal e fino   // coppie: in quel reparto lavora solo insieme ad almeno una di queste persone   // sqPref: squadra di preferenza dei jolly   // noTurni: turni che la persona non può fare
    giorni/AAAA-MM-GG   = { assenze:{idDip:{tipo,nota}},
                            assegnazioni:{idDip:{rep,turno} | {riserva:true}},   // solo gli spostamenti rispetto alla squadra
                            fabbisogno:{idReparto:{idTurno:numero}} | null }   // non più usato: il fabbisogno è settimanale (settimane/.fabbisogno)
    settimane/AAAA-MM-GG (lunedì) = { rotazione:{A,B,C} | null,   // eventuale rotazione cambiata a mano per quella settimana
                                      jolly:{idDip:idTurno},         // turno della settimana di chi è senza squadra
                                      note:{idReparto:testo}, dataStampa:"AAAA-MM-GG" | null }   // note e data di elaborazione (stampata nel modulo)
    dipendenti[].l104 = { giorni:["AAAA-MM-GG"] } | null   // ha la legge 104: 3 giorni di permesso al mese (scheda "104")
    anagrafica.stampa = { responsabile, modulo, autoNote }   // intestazione e piè di pagina del modulo MOD. 80
  Stampa: la vista "Stampa" riproduce il modulo cartaceo (A4 verticale) con la sistemazione prevalente
  della settimana; le colonne seguono il ruolo (capoturno, vicecapoturno, operatore Bundle Fender,
  I/II/III operatore imballaggio). Lo stesso foglio si scarica in PDF (jsPDF da cdnjs).
  Regole: ogni squadra (A, B, C) fa lo stesso turno per tutta la settimana e la settimana dopo ruota
  (mattina → pomeriggio → notte). Chi è "G" (o lavora in un reparto a turno unico giornaliero, come
  Manutenzione e Magazzino) fa il turno giornaliero e non è in squadra. Le squadre sono di reparto:
  la squadra B del Polier non è la squadra B del Corrugar. Chi non ha squadra (jolly) può andare in
  qualsiasi squadra: "Prepara settimana" gli dà il turno dove serve per tutta la settimana.
  Salvataggio: dentro claude.ai usa il database condiviso dell'artifact;
  pubblicato altrove (es. GitHub Pages) con il file firebase-config.js accanto usa Firebase (Firestore),
  con accesso tramite account Google: le email autorizzate sono nelle regole di Firestore;
  senza nessuno dei due salva solo nel browser (localStorage).
  Le persone si gestiscono nelle Schede (aggiungi, rinomina, elimina, note); reparti, turni e dati in Impostazioni.
  Esporta/Importa (Impostazioni) sposta i dati tra le due versioni in un file JSON.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programma settimanale personale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F4F6F9; --ink:#18202B; --muted:#5C6878; --line:#D9DFE7;
  --steel:#2C4A6E; --steel-ink:#FFFFFF; --ok:#2E7D4F; --warn:#B7791F; --bad:#C2342B;
  --moved:#F2B705; --bad-bg:#FBEDEC; --warn-bg:#FCF4E6; --ok-bg:#EAF4EE;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161C; --surface:#1B2129; --ink:#E8EDF3; --muted:#9AA6B5; --line:#2C3540;
    --steel:#7FA6D6; --steel-ink:#0E1620; --ok:#5CB883; --warn:#E0A84A; --bad:#EF6A60;
    --moved:#E5B21C; --bad-bg:#3A1F1E; --warn-bg:#3A2E18; --ok-bg:#1A3024;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1B2129; --ink:#E8EDF3; --muted:#9AA6B5; --line:#2C3540;
  --steel:#7FA6D6; --steel-ink:#0E1620; --ok:#5CB883; --warn:#E0A84A; --bad:#EF6A60;
  --moved:#E5B21C; --bad-bg:#3A1F1E; --warn-bg:#3A2E18; --ok-bg:#1A3024;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.cond{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;letter-spacing:.01em;margin-right:auto}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0}
.datenav{display:flex;align-items:center;gap:6px}
.datenav input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 12px;font-weight:600}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}
.btn.small{padding:3px 9px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs a{padding:6px 14px;text-decoration:none;color:var(--ink);font-weight:600}
.tabs a.on{background:var(--steel);color:var(--steel-ink)}
.sync{font-size:12px;color:var(--muted);width:100%;text-align:right;margin-top:-6px}

main{max-width:1400px;margin:0 auto;padding:14px 16px 40px}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 22px;margin-bottom:12px}
.dayhead h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:32px;margin:0;line-height:1.1}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted)}
.stats b{color:var(--ink);font-size:17px}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

.alert{border:1px solid var(--bad);background:var(--bad-bg);border-radius:8px;padding:12px 14px;margin-bottom:14px}
.alert.okay{border-color:var(--ok);background:var(--ok-bg);padding:8px 14px}
.alert.info{border-color:var(--warn);background:var(--warn-bg);padding:8px 14px}
.alert.info a{color:inherit;font-weight:700}
.alert h2{margin:0 0 8px;font-size:17px}
.urg{border-top:1px solid color-mix(in srgb,var(--bad) 30%,transparent);padding:8px 0}
.urg:first-of-type{border-top:0}
.urg .t{font-weight:700}
.urg .t span{font-weight:500;color:var(--muted)}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cand{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 4px 4px 10px}
.cand .from{color:var(--muted);font-size:13px}
.cand.nocomp{border-style:dashed}
.none{color:var(--muted);font-size:14px}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rep{border:1px solid var(--line);border-radius:8px;background:var(--bg);display:flex;flex-direction:column;min-height:180px}
.rep.drop{outline:2px dashed var(--steel);outline-offset:-2px}
.rep .h{padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.rep .name{font-family:"Barlow Condensed",sans-serif;font-size:21px;font-weight:700;line-height:1.1}
.rep .name small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.rep .num{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.rep .num .big{font-family:"Barlow Condensed",sans-serif;font-size:38px;font-weight:700;line-height:1}
.rep .num .of{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:auto}
.pill.bad{background:var(--bad);color:#fff}
.pill.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.gauge{position:relative;height:6px;background:var(--surface);border-radius:3px;margin-top:8px}
.gauge i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.gauge u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.rep.bad{border-color:var(--bad)}
.rep.bad .h{background:var(--bad-bg)}
.chips{padding:8px;display:flex;flex-direction:column;gap:5px;flex:1}
.chip{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 8px;font-size:14px}
.chip:hover{border-color:var(--steel)}
.chip.moved{border-left:4px solid var(--moved)}
.chip .tag{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.chip .warnc{color:var(--bad);font-weight:700}
.chip[draggable=true]{cursor:grab}
.sqb{font:700 12px/1 "Barlow Condensed",sans-serif;border:1px solid var(--muted);border-radius:3px;padding:2px 5px;background:var(--bg);color:var(--muted);min-width:18px;text-align:center}
.absent{margin-top:16px;border:1px solid var(--line);border-radius:8px}
.absent .h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px}
.absent .h b{font-family:"Barlow Condensed",sans-serif;font-size:21px}
.absent .chips{flex-direction:row;flex-wrap:wrap}
.absent .chip{width:auto}
.absent .chip.urgent{border-left:4px solid var(--bad)}
.legend{font-size:13px;color:var(--muted);margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 16px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;border-radius:2px}
.legend .lm::before{background:var(--moved)}
.legend .la::before{background:var(--bad)}
.legend .ln::before{display:none}

dialog{border:1px solid var(--line);border-radius:10px;padding:0;max-width:min(520px,94vw);width:100%;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dlg{padding:16px 18px}
.dlg h3{font-family:"Barlow Condensed",sans-serif;font-size:26px;margin:0}
.dlg .sub{color:var(--muted);margin-bottom:12px}
.dlg h4{margin:14px 0 6px;font-size:14px;color:var(--muted);font-weight:600}
.grid-btn{display:flex;flex-wrap:wrap;gap:6px}
.grid-btn .btn.cur{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}
.grid-btn .btn .ab{color:var(--ok);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row label{font-size:14px;color:var(--muted)}
.row input,.row select,.row textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.dlg .msg{white-space:pre-line;margin:8px 0 0;line-height:1.45}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

.panel{border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
.panel > .h{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.panel > .h b{font-family:"Barlow Condensed",sans-serif;font-size:22px;margin-right:auto}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:14px}
th{color:var(--muted);font-weight:600;background:var(--surface)}
td input[type=text],td input[type=number],td select{border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--bg);width:100%}
td input[type=number]{width:70px}
td input[type=checkbox]{width:18px;height:18px;accent-color:var(--steel)}
.comp{display:flex;flex-wrap:wrap;gap:4px}
.comp button{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:2px 7px;font-size:12px}
.comp button.on{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}
.comp button.base{opacity:.65;cursor:default}
.hint{font-size:13px;color:var(--muted);padding:8px 12px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.login{max-width:440px;margin:60px auto;border:1px solid var(--line);border-radius:10px;padding:24px;text-align:center;background:var(--bg)}
.login h1{font-family:"Barlow Condensed",sans-serif;font-size:30px;margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 18px}
.login .err{color:var(--bad);margin-top:14px}
.login .gbtn{display:inline-flex;align-items:center;gap:10px;font-size:16px;padding:10px 18px}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

.need{border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.need summary{padding:10px 12px;cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.need summary b{font-family:"Barlow Condensed",sans-serif;font-size:21px}
.need .inner{padding:0 12px 12px}
.need table{min-width:520px}
.need td input[type=number]{width:64px;text-align:center}
.need td.tot,.need th.tot{text-align:center;font-weight:700}
.need tfoot td{background:var(--surface);font-weight:600}
.need .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.need .avail{font-size:12px;color:var(--muted);font-weight:400}
.tg{border-top:1px solid var(--line);padding:6px 8px 8px}
.tg:first-child{border-top:0}
.tg .tl{display:flex;align-items:baseline;gap:6px;font-size:13px;font-weight:600;margin-bottom:4px;flex-wrap:wrap}
.tg .tl .o{color:var(--muted);font-weight:400}
.tg .tl .c{margin-left:auto;font-weight:700}
.tg .tl .c.bad{color:var(--bad)} .tg .tl .c.ok{color:var(--ok)} .tg .tl .c.over{color:var(--warn)}
.tg.drop{background:var(--surface);outline:2px dashed var(--steel);outline-offset:-2px}
.tg .list{display:flex;flex-direction:column;gap:4px}
.hole{border:1px dashed var(--bad);border-radius:5px;padding:4px 8px;font-size:13px;color:var(--bad)}
.rep .chips{padding:0}
.ticks{display:flex;flex-wrap:wrap;gap:4px 12px}
.ticks label{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--ink);cursor:pointer}
.ticks input{width:17px;height:17px;accent-color:var(--steel)}
.ticks label.dis{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card.off{background:var(--bad-bg);border-color:var(--bad)}
.card .top{display:flex;align-items:baseline;gap:8px}
.card .top b{font-family:"Barlow Condensed",sans-serif;font-size:21px;line-height:1.1}
.card .top .btn{margin-left:auto}
.card .lab{font-size:12px;color:var(--muted);margin-bottom:2px}
.card .pres{display:flex;align-items:center;gap:8px;font-weight:600}
.card .pres input{width:19px;height:19px;accent-color:var(--ok)}
.card .warnline{font-size:13px;color:var(--bad)}
.card .fl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card .fl .wide{grid-column:1/-1}
.card select,.card input[type=text]{width:100%;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--bg)}
.l104 .cnt{margin-left:auto;font-weight:700;border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
.l104 .cnt.ok{background:var(--ok-bg);color:var(--ok)} .l104 .cnt.full{background:var(--warn-bg);color:var(--warn)} .l104 .cnt.over{background:var(--bad-bg);color:var(--bad)}
.l104 .gg{display:flex;flex-wrap:wrap;gap:6px}
.l104 .g{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:3px 4px 3px 8px;font-size:14px}
.l104 .g.inwk{border-color:var(--steel);background:var(--bg);font-weight:700;box-shadow:inset 0 0 0 1px var(--steel)}
.l104 .card{min-width:0} .l104 .gg .g{white-space:nowrap}
.l104 .g button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 4px;cursor:pointer}
.l104 .add{display:flex;gap:6px;align-items:center}
.l104 .add input{flex:1;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--bg)}
.l104 .slots{display:flex;gap:4px} .l104 .slots i{width:22px;height:8px;border-radius:2px;background:var(--line)} .l104 .slots i.u{background:var(--steel)} .l104 .slots i.x{background:var(--bad)}
.mnav{display:flex;align-items:center;gap:6px} .mnav b{min-width:140px;text-align:center;font-size:17px}
.b104{font-size:10px;font-weight:700;border:1px solid var(--steel);color:var(--steel);border-radius:3px;padding:0 3px;line-height:1.4}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters input,.filters select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.asg{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
.asg .rn{font-weight:600;font-size:14px}

/* vista settimana */
.sqbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:stretch}
.sqc{border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-width:170px;background:var(--surface)}
.sqc .l{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;line-height:1}
.sqc .t{font-weight:600}
.sqc .n{font-size:13px;color:var(--muted)}
.rotbox{border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;flex:1;min-width:260px}
.rotbox select{border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg)}
.rotbox .mod{font-size:12px;color:var(--warn);font-weight:700}
.wk{table-layout:fixed;min-width:940px}
.wk th,.wk td{vertical-align:top;border-right:1px solid var(--line)}
.wk th:last-child,.wk td:last-child{border-right:0}
.wk thead th{text-align:center}
.wk thead th:nth-child(-n+2){text-align:left}
.wk .rl{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700;line-height:1.15;background:var(--bg)}
.wk .tl2{font-weight:600;font-size:13px;background:var(--bg)}
.wk .tl2 span{display:block;color:var(--muted);font-weight:400}
.wk td.wc{cursor:pointer}
.wk td.wc:hover{outline:2px solid var(--steel);outline-offset:-2px}
.wk td.wc.bad{background:var(--bad-bg)}
.wk td.wc.over{background:var(--warn-bg)}
.wc .cnt{font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;line-height:1.1}
.wc.bad .cnt{color:var(--bad)}
.wc.over .cnt{color:var(--warn)}
.wc .nm{font-size:12px;line-height:1.35}
.wc .nm i{font-style:normal;color:var(--muted)}
.wk tr.sep td,.wk tr.sep th{border-top:2px solid var(--muted)}
.wk tr.sum td,.wk tr.sum th{background:var(--surface)}
.wk.nonames .nm{display:none}
.wk .ab{color:var(--bad)}
.abt{min-width:760px}
.abt td{padding:3px 6px}
.abt select{width:100%;border:1px solid var(--line);border-radius:5px;padding:3px 4px;background:var(--bg);font-size:13px}

<script>
(function(){
"use strict";

/* ---------- costanti ---------- */
const TIPI = [
  {id:"nonprog",   l:"Assenza non programmata", urg:true},
  {id:"malattia",  l:"Malattia",                urg:true},
  {id:"infortunio",l:"Infortunio",              urg:true},
  {id:"ferie",     l:"Ferie",                   urg:false},
  {id:"permesso",  l:"Permesso",                urg:false},
  {id:"altro",     l:"Altro",                   urg:false}
];
const tipo = id => TIPI.find(t=>t.id===id) || TIPI[TIPI.length-1];
const GIORNI = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const NOTURNO = "_";                       // chiave per "squadra/turno da assegnare"
const ORD = ["mattina","pomeriggio","notte"];   // ordine della rotazione delle squadre
const SQUADRE = ["A","B","C"];
const GIORN = "giornaliero";
const TURNI_BASE = [
  {id:"mattina",   nome:"Mattina",    orario:"06–14"},
  {id:"pomeriggio",nome:"Pomeriggio", orario:"14–22"},
  {id:"notte",     nome:"Notte",      orario:"22–06"},
  {id:GIORN,       nome:"Giornaliero",orario:""}
];

/* ---------- stato ---------- */
let ana = null;                  // anagrafica (vedi intestazione)
let day = normDay(null);         // giornata corrente {assenze, assegnazioni, fabbisogno}
let week = {rotazione:null, jolly:{}, note:{}, dataStampa:null, assenze:{}, assegnazioni:{}};   // settimana corrente {rotazione, jolly, note, dataStampa}
let weekMon = "";                // lunedì della settimana a cui si riferisce "week"
let curDate = startDate();
let view = "settimana";
let backend = null;
let readOnly = false;
let weekLoaded = false, dayLoaded = false;
let unsubDay = null, unsubWeek = null;
let anaDirty = false;
let ptrDown = false;
let downloadsCap = null;
let schedeQ = "", schedeRep = "", schedeSq = "";
let l104Mese = "";               // mese mostrato nella scheda 104 ("AAAA-MM"); vuoto = mese della data scelta
let showNames = true;
let migrated = false;
let dateFixed = false;
let absRep = "", absOpen = true;

/* ---------- utilità ---------- */
function isoToday(){ return iso(new Date()); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseIso(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=parseIso(s); d.setDate(d.getDate()+n); return iso(d); }
function dow(s){ return parseIso(s).getDay(); }
function isWeekend(s){ const d=dow(s); return d===0||d===6; }
function mondayOf(s){ const d=dow(s); return addDays(s, d===0 ? -6 : 1-d); }   // sabato e domenica appartengono alla settimana appena finita
function workdays(mon){ return [0,1,2,3,4].map(i=>addDays(mon,i)); }
function stepWork(s,n){ let d=addDays(s,n), g=0; while(isWeekend(d)&&g<7){ d=addDays(d,n); g++; } return d; }
// dal giorno di preparazione (di solito venerdì) il programma si apre sulla settimana dopo
function startDate(p){ const t=isoToday(), d=dow(t), prep=p||5; return (d===0||d===6||d>=prep) ? addDays(mondayOf(t),7) : t; }
function fmtLong(s){ const d=parseIso(s); const g=GIORNI[d.getDay()]; return g[0].toUpperCase()+g.slice(1)+" "+d.getDate()+" "+MESI[d.getMonth()]+" "+d.getFullYear(); }
function fmtShort(s){ const d=parseIso(s); return GIORNI[d.getDay()].slice(0,3)+" "+d.getDate()+"/"+(d.getMonth()+1); }
function fmtDM(s){ const d=parseIso(s); return d.getDate()+" "+MESI[d.getMonth()]; }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(p){ return p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3); }
const $ = id => document.getElementById(id);
// conferma dentro la pagina (le finestre confirm() del browser sono bloccate nell'anteprima di Claude)
function chiedi(msg,o){ o=o||{};
  return new Promise(ok=>{ const dl=$("ask"); let done=false; const fine=v=>{ if(done) return; done=true; if(dl.open) dl.close(); ok(v); };
    $("askBody").innerHTML=`${o.titolo?`<h3>${esc(o.titolo)}</h3>`:""}<div class="msg">${esc(msg)}</div><div class="foot"><button class="btn" id="askNo">${esc(o.no||"Annulla")}</button><button class="btn ${o.danger?"danger":"primary"}" id="askOk">${esc(o.ok||"Conferma")}</button></div>`;
    $("askNo").onclick=()=>fine(false); $("askOk").onclick=()=>fine(true); dl.oncancel=()=>fine(false); dl.onclose=()=>fine(false);
    dl.showModal(); $("askOk").focus(); }); }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),3600); }
function repById(id){ return ana.reparti.find(r=>r.id===id); }
function turnoById(id){ return ana.turni.find(t=>t.id===id); }
function empById(id){ return ana.dipendenti.find(e=>e.id===id); }
function repName(id){ const r=repById(id); return r? r.nome : "—"; }
function turnoName(id){ const t=turnoById(id); return t? t.nome : "Da assegnare"; }
function canRep(e,r){ return e.reparto===r || (e.competenze||[]).includes(r); }
// accoppiamenti: in quel reparto la persona lavora solo se nello stesso turno c'è almeno uno di questi colleghi
// ruoli che devono esserci in ogni turno (nell'ordine in cui si riempiono)
const RUOLI={
  capoturno:{l:"capoturno", m:/^capo ?turno/, bonus:60},
  vicecapoturno:{l:"vicecapoturno", m:/^vice ?capo ?turno/, bonus:45},
  bundle:{l:"operatore Bundle Fender", m:/bundle|fender/, bonus:40},
  imb1:{l:"I operatore imballaggio", m:/^(i|1|primo)\b.*imbal/, bonus:40}
};
const RUOLI_DEF={corrugar:["capoturno","bundle","imb1"], polier:["capoturno","vicecapoturno","imb1"], kingcor:["capoturno","imb1"], reparto5:["capoturno"]};
function haRuolo(e,k){ return !!e && !!RUOLI[k] && RUOLI[k].m.test(normStr(e.ruolo)); }
function isCapo(e){ return haRuolo(e,"capoturno"); }
// ruoli richiesti in un turno: quelli del reparto, finché bastano i posti (con 2 posti al Kingcor: capoturno e I operatore)
function ruoliRichiesti(r,n){ return (r.ruoli||[]).filter(k=>RUOLI[k]).slice(0,Math.max(0,n)); }
// può lavorare in quel turno di quel reparto anche se la sua squadra fa un altro turno (Reparto 5 di notte)
function fuoriTurnoOk(e,r,t,mon){ return t==="notte" && !!(repById(r)||{}).notteAltreSquadre && canTurno(e,t) && ORD.includes(turnoDi(e,mon)); }
// turni (reparto e turno) che richiedono un capoturno e non ce l'hanno
function ruoliMancanti(st,dd,date){
  const fab=fabEff(dd,date), out=[];
  for(const r of ana.reparti){ if(r.giornaliero) continue;
    for(const t of ORD){ const list=st.slots[r.id][t];
      for(const k of ruoliRichiesti(r,fab[r.id][t])) if(!list.some(e=>haRuolo(e,k))) out.push({r, t:turnoById(t), k, list}); } }
  return out;
}
function partnersOf(e,r){ return ((e.coppie||{})[r]||[]).filter(id=>empById(id)); }
function coppiaOk(e,r,ids){ const p=partnersOf(e,r); return !p.length || p.some(id=>ids.includes(id)); }
function nomiPartner(e,r){ return partnersOf(e,r).map(id=>empById(id).nome).join(" o "); }
function normStr(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim(); }
function normDay(d){
  const out={assenze:(d&&d.assenze)||{}, assegnazioni:(d&&d.assegnazioni)||{}, fabbisogno:(d&&d.fabbisogno)||null};
  if(d && d.spostamenti && !d.assegnazioni){ for(const [id,r] of Object.entries(d.spostamenti)) out.assegnazioni[id]={rep:r,turno:null}; }
  return out;
}
function normWeek(d){ const r=d&&d.rotazione, j={}; if(d&&d.jolly) for(const [k,v] of Object.entries(d.jolly)) if(ORD.includes(v)) j[k]=v;
  const note={}; if(d&&d.note) for(const [k,v] of Object.entries(d.note)) if(typeof v==="string"&&v.trim()) note[k]=v;
  const ds=d&&typeof d.dataStampa==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d.dataStampa) ? d.dataStampa : null;
  let fb=null; if(d&&d.fabbisogno&&typeof d.fabbisogno==="object"){ fb={}; for(const [r,m] of Object.entries(d.fabbisogno)) if(m&&typeof m==="object"){ fb[r]={}; for(const [t,v] of Object.entries(m)) fb[r][t]=Math.max(0,parseInt(v,10)||0); } }
  const tr={}; if(d&&d.turniRep) for(const [k,v] of Object.entries(d.turniRep)) if([1,2,3].includes(v)) tr[k]=v;
  const ok=o=>o&&typeof o==="object"&&!Array.isArray(o)? o : {};
  return {rotazione: r && ORD.includes(r.A)&&ORD.includes(r.B)&&ORD.includes(r.C) ? {A:r.A,B:r.B,C:r.C} : null, jolly:j, note, dataStampa:ds, turniRep:tr, fabbisogno:fb,
          assenze:ok(d&&d.assenze), assegnazioni:ok(d&&d.assegnazioni), jollyMan:ok(d&&d.jollyMan)}; }
function normAna(d){
  const a={versione:4, prepDow:[4,5,6].includes(d&&d.prepDow)?d.prepDow:5, reparti:(d&&d.reparti)||[], turni:(d&&d.turni)||[], dipendenti:(d&&d.dipendenti)||[],
           rotazione:Object.assign({rif:"2026-11-16",A:"notte",passo:2}, (d&&d.rotazione)||{})};
  a.stampa=Object.assign({responsabile:"A. Spaccini", modulo:"MOD. 80 - REV.04", autoNote:true}, (d&&d.stampa)||{});
  a.reparti.forEach(r=>{ r.std=r.std||{}; r.giornaliero=!!r.giornaliero; r.turniVariabili=!!r.turniVariabili;
    if(!Array.isArray(r.ruoli)) r.ruoli = RUOLI_DEF[r.id] ? RUOLI_DEF[r.id].slice() : (r.capoObbl ? ["capoturno"] : []);
    r.ruoli=r.ruoli.filter(k=>RUOLI[k]); delete r.capoObbl;
    if(r.minTurno==null) r.minTurno = r.id==="reparto5" ? 2 : 0;
    if(typeof r.notteAltreSquadre!=="boolean") r.notteAltreSquadre = r.id==="reparto5"; });
  TURNI_BASE.forEach(t=>{ if(!a.turni.find(x=>x.id===t.id)) a.turni.push(clone(t)); });
  a.turni.sort((x,y)=>TURNI_BASE.findIndex(t=>t.id===x.id)-TURNI_BASE.findIndex(t=>t.id===y.id));
  const ids=new Set(a.dipendenti.map(e=>e.id)), reps=new Set(a.reparti.map(r=>r.id));
  const isoOk=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v);
  a.dipendenti.forEach(e=>{ const g=e.l104&&Array.isArray(e.l104.giorni)? [...new Set(e.l104.giorni.filter(isoOk))].sort() : null; e.l104 = (e.l104===true||g) ? {giorni:g||[]} : null; });
  a.dipendenti.forEach(e=>{ e.malattia = e.malattia&&isoOk(e.malattia.fino) ? {dal:isoOk(e.malattia.dal)?e.malattia.dal:"", fino:e.malattia.fino} : null; });
  a.dipendenti.forEach(e=>{ const c={}; if(e.coppie&&typeof e.coppie==="object") for(const [r,l] of Object.entries(e.coppie)) if(reps.has(r)&&Array.isArray(l)){ const v=[...new Set(l)].filter(x=>x!==e.id&&ids.has(x)); if(v.length) c[r]=v; } e.coppie=c; });
  a.dipendenti.forEach(e=>{ e.competenze=e.competenze||[]; e.squadra=e.squadra||""; e.ruolo=e.ruolo||""; e.note=e.note||""; e.reparto=e.reparto||""; e.sqPref=SQUADRE.includes(e.sqPref)?e.sqPref:""; e.noTurni=Array.isArray(e.noTurni)? e.noTurni.filter(t=>ORD.includes(t)) : []; if(e.noTurni.length>=ORD.length) e.noTurni=[]; delete e.turni; });
  return a;
}

/* ---------- squadre e rotazione ---------- */
// Squadra effettiva: nei reparti a turno unico giornaliero sono tutti "G"
function sqEff(e){ const r=repById(e.reparto); return r&&r.giornaliero ? "G" : (e.squadra||""); }
function rotBase(){ const r=ana.rotazione||{}; return {rif:r.rif||"2026-11-16", A:ORD.includes(r.A)?r.A:"notte", passo:r.passo===1?1:2}; }
function rotFor(mon){
  if(mon===weekMon && week.rotazione) return week.rotazione;
  const b=rotBase(); const weeks=Math.round((parseIso(mon)-parseIso(b.rif))/(7*864e5));
  const iA=(((ORD.indexOf(b.A)+b.passo*weeks)%3)+3)%3;
  return {A:ORD[iA], B:ORD[(iA+1)%3], C:ORD[(iA+2)%3]};
}
function rotManual(mon){ return mon===weekMon && !!week.rotazione; }
// turno che la persona fa di default in quella settimana
// chi ha un turno escluso (es. niente notte) nella settimana in cui la sua squadra lo fa diventa come un jolly
function turnoDi(e,mon){ const s=sqEff(e); if(s==="G") return GIORN;
  if(SQUADRE.includes(s)){ const t=rotFor(mon)[s]; if(canTurno(e,t)) return t; }
  if(mon===weekMon && week.jolly && week.jolly[e.id] && canTurno(e,week.jolly[e.id])) return week.jolly[e.id];   // turno scelto per la settimana
  return null; }
function canTurno(e,t){ return !t || t===GIORN || t===NOTURNO || !(e.noTurni||[]).includes(t); }
// senza un turno fisso nella settimana: jolly, oppure la sua squadra fa un turno che non può fare
function fuoriSquadra(e,mon){ if(!repById(e.reparto)) return false; if(isJolly(e)) return true; const s=sqEff(e); return SQUADRE.includes(s) && !canTurno(e,rotFor(mon)[s]); }
function motivoFuori(e,mon){ return isJolly(e) ? "jolly senza squadra" : "la squadra "+sqEff(e)+" fa "+turnoName(rotFor(mon)[sqEff(e)]).toLowerCase()+", che non può fare"; }
function noTurniTxt(e){ const n=(e.noTurni||[]).filter(t=>ORD.includes(t)); return n.length? "Non fa: "+n.map(t=>turnoName(t).toLowerCase()).join(", ") : ""; }
function selTurnoSett(e,mon,attr){ return `<select ${attr}><option value="">— da decidere</option>${ORD.filter(t=>canTurno(e,t)).map(t=>`<option value="${t}" ${week.jolly[e.id]===t?"selected":""}>${esc(turnoName(t))} (con la squadra ${esc(sqOfTurno(t,mon))}${isJolly(e)&&e.sqPref===sqOfTurno(t,mon)?", preferita":""})</option>`).join("")}</select>`; }
function sqPrefOptions(e){ return `<option value="" ${e.sqPref?"":"selected"}>Nessuna: dove serve di più</option>`+SQUADRE.map(q=>`<option value="${q}" ${e.sqPref===q?"selected":""}>Squadra ${q}</option>`).join(""); }
function turniHtml(e,head){ if(sqEff(e)==="G") return "";
  return head+`<div class="ticks">`+ORD.map(t=>`<label><input type="checkbox" data-tok="${t}" ${canTurno(e,t)?"checked":""}>${esc(turnoName(t))}</label>`).join("")+`</div>`; }
function bindTurni(root,e,after){
  root.querySelectorAll("[data-tok]").forEach(c=>c.onchange=()=>{
    const t=c.dataset.tok, nt=(e.noTurni||[]).filter(x=>x!==t); if(!c.checked) nt.push(t);
    if(nt.length>=ORD.length){ c.checked=true; toast("Deve poter fare almeno un turno"); return; }
    e.noTurni=nt;
    if(week.jolly[e.id] && !canTurno(e,week.jolly[e.id])){ delete week.jolly[e.id]; saveWeek(); }
    saveAna(); after&&after(); }); }
function isJolly(e){ const r=repById(e.reparto); return !!r && !r.giornaliero && !sqEff(e); }
function sqTag(e){ return sqEff(e)||"J"; }
function sqOfTurno(t,mon){ if(t===GIORN) return "G"; const r=rotFor(mon); return SQUADRE.find(s=>r[s]===t)||""; }
function sqLabel(t,mon){ const s=sqOfTurno(t,mon); return s==="G" ? "turno unico" : s ? "Squadra "+s : ""; }
function incompleti(){
  const senzaRep=ana.dipendenti.filter(e=>!repById(e.reparto)).length;
  const senzaSq=ana.dipendenti.filter(e=>repById(e.reparto) && !sqEff(e)).length;
  return {senzaRep, senzaSq};
}
function banner(){
  const i=incompleti(), mon=mondayOf(curDate); let h="";
  if(i.senzaRep) h+=`<div class="alert info noprint">${i.senzaRep+(i.senzaRep===1?" persona senza reparto":" persone senza reparto")}: indica il reparto nelle <a href="#schede">Schede</a> (oppure incolla l’elenco da Excel in <a href="#impostazioni">Impostazioni</a>).</div>`;
  const jn=ana.dipendenti.filter(e=>fuoriSquadra(e,mon)&&!turnoDi(e,mon));
  if(jn.length) h+=`<div class="alert info noprint">${jn.length===1?"1 persona senza un turno fisso (jolly, o con la squadra in un turno che non può fare) non ha":jn.length+" persone senza un turno fisso (jolly, o con la squadra in un turno che non possono fare) non hanno"} ancora un turno nella settimana dal ${esc(fmtDM(mon))}: ${jn.slice(0,8).map(e=>esc(e.nome)).join(", ")}${jn.length>8?"…":""}. Premi <b>Prepara settimana</b> nella vista <a href="#settimana">Settimana</a> o scegli il turno dalla loro scheda.</div>`;
  const p104=ana.dipendenti.filter(e=>giorni104Sett(e,mon).length);

function makeLocalBackend(){
  const mem={};
  const read=p=>{ try{ const v=localStorage.getItem("dp:"+p); if(v) return JSON.parse(v);}catch(e){} return mem[p]||null; };
  const write=(p,d)=>{ mem[p]=d; try{ localStorage.setItem("dp:"+p, JSON.stringify(d)); }catch(e){} };
  const list=pfx=>{ const ids=new Set(Object.keys(mem).filter(k=>k.startsWith(pfx)).map(k=>k.slice(pfx.length)));
      try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith("dp:"+pfx)) ids.add(k.slice(3+pfx.length)); } }catch(e){}
      return [...ids].map(id=>[id, read(pfx+id)]).filter(x=>x[1]); };
  return { kind:"local",
    sub(p,cb){ cb(read(p),{fromCache:false}); return ()=>{}; },
    async get(p){ return read(p); },
    async set(p,d){ write(p,d); },

    async listWeeks(){ return list("settimane/"); } };
}
function makeDbBackend(db,kind){

    sub(p,cb,err){ return db.doc(p).onSnapshot(s=>cb(s.exists? clone(s.data()) : null, s.metadata), err); },
    async get(p){ const s=await db.doc(p).get(); return s.exists? clone(s.data()) : null; },
    async set(p,d){ await db.doc(p).set(d); },

    async listWeeks(){ const s=await db.collection("settimane").get(); return s.docs.map(d=>[d.id, clone(d.data())]); } };
}

async function flush(path){

    catch(e){

      else if(e && e.code==="invalid_argument"){ readOnly=true; toast("Sola lettura: le modifiche non vengono salvate."); }

/* ---------- fabbisogno ---------- */
// Reparti con turni decisi settimana per settimana (es. Reparto 5): 1 = mattina, 2 = mattina e pomeriggio, 3 = tutti e tre.
const TURNI_N={1:["mattina"],2:["mattina","pomeriggio"],3:ORD};
const TURNI_N_LAB={1:"1 turno (mattina)",2:"2 turni (mattina e pomeriggio)",3:"3 turni (mattina, pomeriggio e notte)"};
function nTurniStd(r){ return Math.max(1, ORD.filter(t=>(parseInt(r.std[t],10)||0)>0).length); }
function nTurniRep(r,mon){ if(!r.turniVariabili||r.giornaliero) return 3;
  const v = mon===weekMon && week.turniRep ? week.turniRep[r.id] : null; return [1,2,3].includes(v)? v : nTurniStd(r); }
function turnoAttivo(r,t,mon){ return !ORD.includes(t) || TURNI_N[nTurniRep(r,mon)].includes(t); }
// con la data applica i turni scelti per la settimana; senza data restituisce i valori impostati (standard o del giorno)
// Fabbisogno della settimana: deciso per tutta la settimana (week.fabbisogno), altrimenti lo standard del reparto.
function fabSett(mon){
  const src = mon===weekMon && week.fabbisogno ? week.fabbisogno : null, f={};
  for(const r of ana.reparti){ f[r.id]={};
    for(const t of ana.turni){ const w=src&&src[r.id]; const v = w && w[t.id]!=null ? w[t.id] : r.std[t.id]; f[r.id][t.id]=Math.max(0,parseInt(v,10)||0); } }
  return f;
}
function fabEff(dd,date){
  const f=fabSett(date? mondayOf(date) : weekMon);
  if(date){ const mon=mondayOf(date);
    for(const r of ana.reparti){ if(!r.turniVariabili||r.giornaliero) continue;
      const ref=Math.max(1,...ORD.map(t=>f[r.id][t]));   // turno attivo senza un numero: come il turno più numeroso
      for(const t of ORD){ if(!turnoAttivo(r,t,mon)) f[r.id][t]=0; else if(!f[r.id][t]) f[r.id][t]=ref; } }
    for(const r of ana.reparti){ const m=parseInt(r.minTurno,10)||0; if(m>0&&!r.giornaliero) for(const t of ORD) if(f[r.id][t]>0&&f[r.id][t]<m) f[r.id][t]=m; } }

}
// la cella ha senso? (i reparti a turno unico hanno solo il turno giornaliero)
const turnoApplicabile = (r,t) => r.giornaliero ? t===GIORN : true;

/* ---------- calcolo presenze ---------- */
function assignOf(e,dd,date){ return dd.assegnazioni[e.id] || {rep:e.reparto, turno:turnoDi(e,mondayOf(date))}; }
function compute(dd,date){
  const slots={}; ana.reparti.forEach(r=>{ slots[r.id]={}; ana.turni.forEach(t=>slots[r.id][t.id]=[]); slots[r.id][NOTURNO]=[]; });
  const assenti=[], riserve=[], senza=[];
  for(const e of ana.dipendenti){
    if(dd.assenze[e.id]){ assenti.push(e); continue; }
    const a=assignOf(e,dd,date);
    if(a.riserva){ riserve.push(e); continue; }
    if(!slots[a.rep]){ senza.push(e); continue; }
    const k = a.turno && turnoById(a.turno) ? a.turno : NOTURNO;
    slots[a.rep][k].push(e);
  }
  const byName=(a,b)=>a.nome.localeCompare(b.nome);
  for(const r in slots) for(const t in slots[r]) slots[r][t].sort(byName);
  riserve.sort(byName); assenti.sort(byName); senza.sort(byName);
  return {slots, assenti, riserve, senza};
}
function shortages(st,dd,date){
  const fab=fabEff(dd,date), mon=mondayOf(date), out=[];
  // chi può essere spostato senza aprire un buco: disponibili, senza squadra, eccedenze
  const pool=[];
  st.riserve.forEach(e=>pool.push({e, from:"non utilizzati"}));
  for(const r of ana.reparti){
    st.slots[r.id][NOTURNO].forEach(e=>pool.push({e, from:r.nome+", da assegnare"}));
    for(const t of ana.turni){ const list=st.slots[r.id][t.id], over=list.length-fab[r.id][t.id];
      if(over>0 && (t.id!==GIORN || fab[r.id][t.id]>0)) list.forEach(e=>pool.push({e, from:r.nome+" "+t.nome.toLowerCase()+" (+"+over+")"})); }
  }
  for(const r of ana.reparti) for(const t of ana.turni){
    const n=fab[r.id][t.id], have=st.slots[r.id][t.id].length; if(have>=n) continue;
    const full=[], part=[];
    for(const c of pool){
      if(!canTurno(c.e,t.id)) continue;   // turno che non può fare: non proporlo
      const okR=canRep(c.e,r.id), okT=turnoDi(c.e,mon)===t.id || fuoriTurnoOk(c.e,r.id,t.id,mon), okC=coppiaOk(c.e,r.id,st.slots[r.id][t.id].map(x=>x.id));
      if(okR&&okT&&okC) full.push(c);
      else if(okR&&okT) part.push(Object.assign({why:"lì lavora solo insieme a "+nomiPartner(c.e,r.id)},c));
      else if(okR||okT){ const sq=sqEff(c.e), tt=turnoDi(c.e,mon);
        part.push(Object.assign({why: okR? (sq==="G"?"turno unico giornaliero":(sq?"squadra "+sq:"jolly")+(tt?" di "+turnoName(tt).toLowerCase()+" questa settimana":" senza turno")) : "non abilitato a "+r.nome}, c)); }
    }
    const ord=(a,b)=>(a.e.reparto===r.id?0:1)-(b.e.reparto===r.id?0:1)||a.e.nome.localeCompare(b.e.nome);
    full.sort(ord); part.sort(ord);
    // ultima possibilità: chi è abilitato e lavora nello stesso turno in un altro reparto (lì si apre un buco)
    const steal=[];
    for(const r2 of ana.reparti){ if(r2.id===r.id) continue;
      for(const e of st.slots[r2.id][t.id]){ if(!canRep(e,r.id)||!canTurno(e,t.id)||pool.some(c=>c.e===e)) continue;
        const okC=coppiaOk(e,r.id,st.slots[r.id][t.id].map(x=>x.id));
        steal.push({e, from:r2.nome+" "+t.nome.toLowerCase(), why:"lì resterebbe un posto scoperto"+(okC?"":"; inoltre qui lavora solo insieme a "+nomiPartner(e,r.id))}); } }
    steal.sort((a,b)=>a.e.nome.localeCompare(b.e.nome));
    out.push({r, t, n, have, manca:n-have, full:full.slice(0,8), part:part.slice(0,4), steal:steal.slice(0,3)});
  }
  return out;
}

/* ---------- compensazione automatica (flusso a costo minimo) ----------
   Ogni persona resta nel turno della sua squadra: può cambiare solo reparto (se abilitata).
   Chi non trova posto nel proprio turno resta "disponibile". */
// fissi: {idDip:{rep,turno}|{riserva}} messi a mano, che restano dove sono e occupano il loro posto
function creaSquadre(dd,date,fissi){
  // ripete il calcolo togliendo i posti in cui un accoppiamento non è rispettato, finché tutti lo sono
  fissi=fissi||{}; const forbid=new Set(); let out;
  for(let k=0;k<40;k++){
    out=flussoSquadre(dd,date,fissi,forbid);
    const at={}; const put=(id,a)=>{ if(a&&!a.riserva&&a.rep&&a.turno){ const key=a.rep+"|"+a.turno; (at[key]=at[key]||[]).push(id); } };
    for(const [id,a] of Object.entries(fissi)) put(id,a);
    for(const [id,a] of Object.entries(out.res)) put(id,a);
    let bad=false;
    for(const [id,a] of Object.entries(out.res)){ if(a.riserva) continue; const e=empById(id);
      if(!coppiaOk(e,a.rep,at[a.rep+"|"+a.turno]||[])){ forbid.add(id+"|"+a.rep+"|"+a.turno); bad=true; } }
    if(!bad) break;
  }
  return out;
}
function flussoSquadre(dd,date,fissi,forbid){
  const mon=mondayOf(date), fab=fabEff(dd,date), occ={}, fissiIn={};
  for(const [id,a] of Object.entries(fissi)) if(!a.riserva && a.rep && a.turno){ const k=a.rep+"|"+a.turno; occ[k]=(occ[k]||0)+1; (fissiIn[k]=fissiIn[k]||[]).push(empById(id)); }
  const emps=ana.dipendenti.filter(e=>!dd.assenze[e.id] && !fissi[e.id] && turnoDi(e,mon));
  const slots=[]; for(const r of ana.reparti) for(const t of ana.turni){ const n=fab[r.id][t.id]-(occ[r.id+"|"+t.id]||0); if(n>0) slots.push({r:r.id,t:t.id,n}); }
  // posti dei ruoli obbligatori: un nodo da 1 per ruolo che passa per il turno e vale molto, così ogni turno riceve i suoi ruoli se possibile
  const capi=[]; slots.forEach((s,j)=>{ if(!ORD.includes(s.t)) return; const r=repById(s.r), k0=s.r+"|"+s.t;
    for(const k of ruoliRichiesti(r,fab[s.r][s.t])) if(!(fissiIn[k0]||[]).some(e=>haRuolo(e,k))) capi.push({j,k}); });
  const E=emps.length, K=slots.length, C=capi.length, S=0, T=E+K+C+1, N=T+1, slotN=j=>E+1+j, capoN=c=>E+K+1+c;
  const g=Array.from({length:N},()=>[]);
  const add=(u,v,cap,cost)=>{ g[u].push({v,cap,cost,rev:g[v].length}); g[v].push({v:u,cap:0,cost:-cost,rev:g[u].length-1}); };
  emps.forEach((e,i)=>{
    add(S,i+1,1,0);
    const mine=turnoDi(e,mon), prev=assignOf(e,dd,date);
    slots.forEach((s,j)=>{
      if(!canRep(e,s.r)||forbid.has(e.id+"|"+s.r+"|"+s.t)) return;
      const fuori = s.t!==mine;
      if(fuori && !fuoriTurnoOk(e,s.r,s.t,mon)) return;
      let cost = (e.reparto===s.r?0:4) + (fuori?30:0);            // preferisce il reparto principale; fuori turno solo se serve davvero
      if(!(prev && prev.rep===s.r && prev.turno===s.t)) cost+=1;   // stabilità rispetto alla situazione attuale
      add(i+1,slotN(j),1,cost);
      capi.forEach((c,ci)=>{ if(c.j===j && haRuolo(e,c.k)) add(i+1,capoN(ci),1,cost); });
    });
  });
  slots.forEach((s,j)=>add(slotN(j),T,s.n,0));
  capi.forEach((c,k)=>add(capoN(k),slotN(c.j),1,-RUOLI[c.k].bonus));
  let filled=0;
  while(true){
    const dist=Array(N).fill(Infinity), inq=Array(N).fill(false), pv=Array(N).fill(-1), pe=Array(N).fill(-1);
    dist[S]=0; const q=[S]; inq[S]=true;
    while(q.length){ const u=q.shift(); inq[u]=false;
      g[u].forEach((ed,k)=>{ if(ed.cap>0 && dist[u]+ed.cost<dist[ed.v]){ dist[ed.v]=dist[u]+ed.cost; pv[ed.v]=u; pe[ed.v]=k; if(!inq[ed.v]){ inq[ed.v]=true; q.push(ed.v); } } }); }
    if(dist[T]===Infinity) break;

    filled++;
  }
  const res={};
  emps.forEach((e,i)=>{ const ed=g[i+1].find(x=>x.v>E && x.v<T && x.cap===0);
    const j = !ed ? -1 : ed.v<=E+K ? ed.v-E-1 : capi[ed.v-E-K-1].j;
    res[e.id]= j>=0 ? {rep:slots[j].r, turno:slots[j].t} : {riserva:true}; });

  return {res, filled, tot, ids:new Set(emps.map(e=>e.id))};
}
async function runCrea(){
  if(isWeekend(curDate)) return;

/* ---------- prepara la settimana ----------
   1. i jolly (senza squadra) prendono per tutta la settimana il turno in cui mancano più persone
      (nel loro reparto o in quelli in cui sono abilitati);
   2. giorno per giorno si compensano le carenze spostando chi è abilitato, restando nel proprio turno.
   Chi avanza resta segnalato come "addetto non utilizzato"; i turni senza abbastanza persone restano scoperti. */
async function preparaSettimana(opt){
  opt=opt||{}; const auto=!!opt.auto;
  const mon=mondayOf(curDate);
  if(!auto && !(await chiedi("I jolly e chi non può fare il turno della sua squadra vengono messi nel turno dove servono. Poi chi è abilitato viene spostato da un reparto all’altro per avere in ogni turno esattamente le persone previste, tenendo conto delle assenze.\n\nGli spostamenti fatti a mano in questa settimana verranno ricalcolati.",{titolo:"Preparare la settimana dal "+fmtDM(mon)+"?",ok:"Prepara"}))) return;
  if(mon!==weekMon) return;
  if(!weekLoaded){ if(!auto) toast("Sto ancora caricando la settimana, riprova tra un attimo."); else autoRicalcolo(); return; }
  if(auto && mon<mondayOf(isoToday())) return;   // le settimane passate non si ricalcolano da sole
  applicaMalattie();
  // turni della settimana dei jolly: ricalcolati, tranne quelli scelti a mano (che il pulsante Prepara settimana rimette in gioco)
  if(!auto){ week.jolly={}; week.jollyMan={}; }
  else for(const id of Object.keys(week.jolly)) if(!(week.jollyMan||{})[id]) delete week.jolly[id];
  week.dataStampa=isoToday();                       // data di elaborazione del programma
  const opts=e=>ana.reparti.filter(r=>!r.giornaliero && canRep(e,r.id)).map(r=>r.id);
  const f=fabEff(week,mon), def={};
  for(const r of ana.reparti){ def[r.id]={}; for(const t of ORD) def[r.id][t]=f[r.id][t]; }
  for(const e of ana.dipendenti){ if(week.assenze[e.id]) continue; const t=turnoDi(e,mon); if(!t||t===GIORN||!def[e.reparto]) continue; def[e.reparto][t]--; }
  // ruoli obbligatori ancora scoperti per reparto e turno, contando chi ha già quel turno nel suo reparto
  const rgap={}; for(const r of ana.reparti){ rgap[r.id]={}; for(const t of ORD){ rgap[r.id][t]={}; for(const k of ruoliRichiesti(r,f[r.id][t])) rgap[r.id][t][k]=1; } }
  for(const e of ana.dipendenti){ if(week.assenze[e.id]) continue; const t=turnoDi(e,mon); if(!t||t===GIORN||!rgap[e.reparto]) continue; for(const k in rgap[e.reparto][t]) if(haRuolo(e,k)) rgap[e.reparto][t][k]=0; }
  const ruoloServe=(e,t)=>opts(e).some(r=>Object.entries(rgap[r][t]).some(([k,v])=>v>0&&haRuolo(e,k)));
  const jolly=ana.dipendenti.filter(e=>fuoriSquadra(e,mon) && !turnoDi(e,mon) && !week.assenze[e.id]).sort((a,b)=>opts(a).length-opts(b).length||a.nome.localeCompare(b.nome));
  for(const e of jolly){
    let best=null;
    for(const t of ORD){
      if(!canTurno(e,t) || !opts(e).some(r=>f[r][t]>0)) continue;   // turno che non può fare o in cui i suoi reparti non lavorano
      const gap=Math.max(0,...opts(e).map(r=>def[r][t])), base=def[e.reparto]? def[e.reparto][t] : 0;
      const pref = !!(isJolly(e) && e.sqPref && sqOfTurno(t,mon)===e.sqPref && gap>0);   // squadra di preferenza: se lì serve qualcuno va lì
      const rs = gap>0 && ruoloServe(e,t);                                                // lì manca il suo ruolo
      const better = !best || (pref!==best.pref ? pref : rs!==best.rs ? rs : (gap>best.gap || (gap===best.gap && base>best.base)));
      if(better) best={t,gap,base,pref,rs};
    }
    if(!best) continue;

    for(const r of opts(e)) for(const k in rgap[r][best.t]) if(rgap[r][best.t][k]>0 && haRuolo(e,k)){ rgap[r][best.t][k]=0; break; }
    let rr=opts(e)[0]; for(const r of opts(e)) if(def[r][best.t]>def[rr][best.t] || (r===e.reparto && def[r][best.t]===def[rr][best.t])) rr=r;
    if(rr) def[rr][best.t]--;
  }

  const asg=Object.assign({},fissi);
  const {res}=creaSquadre({assenze:week.assenze, assegnazioni:asg},mon,fissi);
  for(const e of ana.dipendenti){ const r=res[e.id]; if(!r) continue;
    if(r.riserva){ asg[e.id]={riserva:true}; continue; }
    if(r.rep!==e.reparto || r.turno!==turnoDi(e,mon)) asg[e.id]=r; }
  week.assegnazioni=asg; saveWeek();
  const st=compute(week,mon), scop=shortages(st,week,mon).reduce((a,u)=>a+u.manca,0), inut=st.riserve.length, nc=ruoliMancanti(st,week,mon).length;
  render();
  toast((auto?"Programma ricalcolato":"Settimana preparata")+": "+(scop? scop+(scop===1?" posto scoperto":" posti scoperti"):"ogni turno ha le persone previste")+(nc? ", "+nc+(nc===1?" ruolo obbligatorio mancante":" ruoli obbligatori mancanti"):"")+(inut? ", "+inut+" addetti non utilizzati":"")+".");
}
// ricalcolo automatico della settimana dopo ogni modifica che cambia i numeri (fabbisogno, turni, assenze, schede)
let autoT=null, autoBusy=false, autoAgain=false, autoFrom=null;
function autoRicalcolo(from){
  if(!ana || readOnly || !backend) return;
  autoFrom=weekMon;
  clearTimeout(autoT); autoT=setTimeout(async()=>{
    if(autoBusy){ autoAgain=true; return; }
    autoBusy=true; const f=autoFrom; autoFrom=null;
    try{ await preparaSettimana({auto:true, from:f}); }catch(e){}
    autoBusy=false; if(autoAgain){ autoAgain=false; autoRicalcolo(); }
  }, 700);
}

/* ---------- azioni ---------- */
function assign(empId, rep, turno){
  const e=empById(empId); if(!e) return;
  delete day.assenze[empId];
  const mon=mondayOf(curDate), t=(turno&&turno!==NOTURNO)?turno:null;
  if(rep==="__ris") day.assegnazioni[empId]={riserva:true, man:true};
  else day.assegnazioni[empId]={rep, turno:t, man:true};   // scelta a mano: il ricalcolo automatico la lascia com'è
  saveDay(); render(); autoRicalcolo();
  toast(e.nome+" → "+(rep==="__ris"?"non utilizzati":repName(rep)+(t?", "+turnoName(t).toLowerCase():""))+(rep!=="__ris"&&!canTurno(e,t)?". Attenzione: non può fare questo turno":""));
}
// malattie con scadenza (dalla scheda): la persona è assente in ogni settimana che tocca il periodo
function malattiaCopre(e,mon){ const m=e.malattia; return !!m && m.fino>=mon && (!m.dal || m.dal<=addDays(mon,4)); }
function applicaMalattie(){
  if(!ana) return false; const mon=weekMon; let ch=false;
  for(const e of ana.dipendenti){ const cur=week.assenze[e.id];
    if(malattiaCopre(e,mon)){ const nota="fino al "+fmtIt(e.malattia.fino);
      if(!cur || (cur.auto && cur.nota!==nota)){ week.assenze[e.id]={tipo:"malattia", nota, auto:true}; delete week.assegnazioni[e.id]; ch=true; } }
    else if(cur && cur.auto){ delete week.assenze[e.id]; ch=true; } }
  for(const id of Object.keys(week.assenze)) if(week.assenze[id].auto && !empById(id)){ delete week.assenze[id]; ch=true; }
  return ch;
}
function setMalattia(e,fino,dal){
  if(fino){ e.malattia={dal: dal || (e.malattia&&e.malattia.dal) || [isoToday(), weekMon].sort()[0], fino}; }
  else e.malattia=null;
  saveAna(); if(applicaMalattie()) saveWeek(); render();
}
function setAbsent(empId, tipoId, nota){
  const e=empById(empId); if(!e) return;
  const rec={tipo:tipoId}; if(nota) rec.nota=nota;
  day.assenze[empId]=rec; delete day.assegnazioni[empId];
  saveDay(); render(); autoRicalcolo();
  toast(e.nome+": "+tipo(tipoId).l.toLowerCase()+" per la settimana dal "+fmtDM(weekMon));
}
function setPresent(empId){ const e=empById(empId), a=day.assenze[empId];
  if(a && a.auto && e && e.malattia){   // malattia con scadenza: termina prima di questa settimana
    const fino=addDays(weekMon,-3); if(e.malattia.dal && e.malattia.dal>fino) e.malattia=null; else e.malattia.fino=fino; save("dati/anagrafica",ana); }
  delete day.assenze[empId]; saveDay(); render(); autoRicalcolo(); }
async function resetMoves(){
  if(!Object.keys(day.assegnazioni).length){ toast("Non ci sono spostamenti da annullare"); return; }
  if(!(await chiedi("Tutti tornano al reparto e al turno della loro squadra per questa settimana. Poi il programma ricalcola da solo le coperture.",{titolo:"Annullare gli spostamenti?",ok:"Annulla spostamenti",no:"Indietro"}))) return;
  day.assegnazioni={}; saveDay(); render(); autoRicalcolo();
}

/* ---------- vista giornata ---------- */
function rotLine(mon){
  const r=rotFor(mon);
  return SQUADRE.map(s=>`<span><b>${s}</b> ${esc(turnoName(r[s]).toLowerCase())}</span>`).join("");
}
function renderNeed(mode){
  const sett=mode==="settimana", mon=sett? weekMon : mondayOf(curDate), fab=fabEff(null,mon), totT={}; let tot=0;
  ana.turni.forEach(t=>totT[t.id]=0);
  const avail={}; ana.turni.forEach(t=>avail[t.id]=ana.dipendenti.filter(e=>(sett||!day.assenze[e.id])&&turnoDi(e,mon)===t.id).length);
  const open = sett ? renderNeed.openW!==false : renderNeed.open===true;
  let h=`<details class="need noprint" ${open?"open":""} id="${sett?"needW":"needBox"}"><summary><b>Fabbisogno della settimana</b><span class="none">quante persone servono per reparto e turno, da lunedì a venerdì${week.fabbisogno?"":" (valori standard)"}</span></summary><div class="inner"><div class="scroll"><table><thead><tr><th>Reparto</th>`+
    ana.turni.map(t=>`<th class="tot">${esc(t.nome)}<br><span class="avail">${esc(t.orario||"")}${t.orario?" · ":""}${esc(sqLabel(t.id,mon))}</span></th>`).join("")+`<th class="tot">Totale</th></tr></thead><tbody>`;
  for(const r of ana.reparti){
    let rt=0;
    h+=`<tr><td>${esc(r.nome)}${r.giornaliero?` <span class="none">(turno unico)</span>`:""}</td>`+ana.turni.map(t=>{
      if(!turnoApplicabile(r,t.id)) return `<td class="tot none">–</td>`;
      if(!turnoAttivo(r,t.id,mon)) return `<td class="tot none" title="Questa settimana ${esc(r.nome)} non lavora in questo turno">–</td>`;
      const v=fab[r.id][t.id]; rt+=v; totT[t.id]+=v;
      return sett ? `<td class="tot"><input type="number" min="0" max="99" data-nr="${r.id}" data-nt="${t.id}" value="${v}" aria-label="${esc(r.nome)} ${esc(t.nome)}"></td>` : `<td class="tot">${v}</td>`; }).join("")+`<td class="tot">${rt}</td></tr>`;
    tot+=rt;
  }
  const pres = sett ? ana.dipendenti.length : ana.dipendenti.length-Object.keys(day.assenze).filter(id=>empById(id)).length;
  h+=`</tbody><tfoot><tr><td>${sett?"Servono / persone in quel turno":"Servono / presenti in quel turno"}</td>`+ana.turni.map(t=>`<td class="tot" style="color:${totT[t.id]>avail[t.id]?"var(--bad)":"inherit"}">${totT[t.id]} / ${avail[t.id]}</td>`).join("")+
    `<td class="tot">${tot} / ${pres}</td></tr></tfoot></table></div>`+
    (sett ? `<div class="acts"><button class="btn small" id="stdSave">Salva come standard</button><button class="btn small" id="stdLoad">Torna ai valori standard</button>
      <span class="none">Vale per tutta la settimana. Dopo ogni modifica il programma ridistribuisce da solo le persone.</span></div>`
          : `<div class="acts"><button class="btn primary" id="crea">Compensa carenze</button>
      <span class="none">Il fabbisogno vale per tutta la settimana e si cambia nella vista <a href="#settimana">Settimana</a>. Compensa carenze sposta da un reparto all’altro solo chi è abilitato, restando nel turno della sua squadra.</span></div>`)+`</div></details>`;
  return h;
}
function chipHtml(e, rep, turno, list){
  const mon=mondayOf(curDate), moved = rep && rep!==e.reparto;
  const noRep = rep && !canRep(e,rep), noT = turno && turno!==NOTURNO && turnoDi(e,mon)!==turno, noTT = !canTurno(e,turno);
  const noC = rep && list && turno!==NOTURNO && !coppiaOk(e,rep,list.map(x=>x.id));
  const warn = (noRep||noT||noTT||noC) ? ` <span class="warnc" title="${noTT?"Non può fare il turno "+esc(turnoName(turno).toLowerCase()):noRep?"Non abilitato a questo reparto":noC?"Qui lavora solo insieme a "+esc(nomiPartner(e,rep)):"Turno diverso da quello della sua squadra"}">!</span>` : "";
  const s=sqEff(e);
  return `<button class="chip ${moved?"moved":""}" data-emp="${e.id}" draggable="true"><span class="sqb" title="${s==="G"?"Turno unico giornaliero":s?"Squadra "+s:"Jolly: senza squadra, va in qualsiasi squadra"}">${esc(s||"J")}</span>${esc(e.nome)}${giorni104Sett(e,mon).length?` <span class="b104" title="Permesso 104: ${esc(giorni104Sett(e,mon).map(fmtShort).join(", "))}">104</span>`:""}${warn}<span class="tag">${esc(e.ruolo||"")}${moved?`${e.ruolo?" · ":""}da ${esc(repName(e.reparto))}`:""}</span></button>`;
}
function renderSett(){
  const mon=mondayOf(curDate), sat=addDays(mon,5);
  const st=compute(day,curDate), fab=fabEff(day,curDate);
  const tot=ana.dipendenti.length, ass=st.assenti.length;
  const mov=ana.dipendenti.filter(e=>{ const a=day.assegnazioni[e.id]; return !day.assenze[e.id] && a && !a.riserva && a.rep!==e.reparto; }).length;
  const urg=shortages(st,day,curDate);
  let h=`<div class="dayhead"><h1>Settimana dal ${esc(fmtDM(mon))} al ${esc(fmtDM(sat))}</h1>
    <div class="stats"><span>da <b>lunedì ore 06:00</b> a <b>sabato ore 06:00</b></span>${mon>mondayOf(isoToday())?`<span class="pill warn" style="margin:0">settimana prossima</span>`:mon===mondayOf(isoToday())?`<span class="pill ok" style="margin:0">settimana in corso</span>`:`<span class="pill" style="margin:0">settimana passata</span>`}<span><b>${tot}</b> in organico</span><span><b>${tot-ass}</b> presenti</span><span><b>${ass}</b> assenti</span><span><b>${mov}</b> fuori reparto</span><span><b>${st.riserve.length}</b> non utilizzati</span></div>
    <div class="tools"><button class="btn small primary" id="prep">Prepara settimana</button><button class="btn small" id="rst">Annulla spostamenti</button><button class="btn small" id="prt">Stampa programma</button></div></div>`;
  h+=banner();
  h+=sqBarHtml(mon);
  h+=renderNeed("settimana");

  if(urg.length){
    h+=`<section class="alert"><h2>${urg.length===1?"1 turno scoperto":urg.length+" turni scoperti"}</h2>`;
    for(const u of urg){
      h+=`<div class="urg"><div class="t">${esc(u.r.nome)}, ${esc(u.t.nome.toLowerCase())} <span>mancano ${u.manca} (assegnati ${u.have} su ${u.n})</span></div>`;
      if(u.full.length) h+=`<div class="cands">`+u.full.map(c=>`<span class="cand"><span>${esc(c.e.nome)}${c.e.ruolo?" ("+esc(c.e.ruolo)+")":""} <span class="from">da ${esc(c.from)}</span></span><button class="btn small primary" data-mv="${c.e.id}" data-to="${u.r.id}" data-tt="${u.t.id}">Sposta</button></span>`).join("")+`</div>`;
      else h+=`<div class="none">Nessuna persona libera abilitata a questo reparto nello stesso turno.${u.part.length||u.steal.length?" Altre possibilità:":" Si può coprire abilitando altre persone a "+esc(u.r.nome)+" nelle schede."}</div>`;
      if(u.part.length||u.steal.length) h+=`<div class="cands">`+u.part.concat(u.steal).map(c=>`<span class="cand nocomp"><span>${esc(c.e.nome)} <span class="from">da ${esc(c.from)}, ${esc(c.why)}</span></span><button class="btn small" data-mv="${c.e.id}" data-to="${u.r.id}" data-tt="${u.t.id}">Sposta</button></span>`).join("")+`</div>`;
      h+=`</div>`;
    }
    h+=`</section>`;
  } else if(ana.reparti.length){
    h+=`<div class="alert okay noprint">Tutti i turni della settimana hanno esattamente le persone previste.</div>`;
  }

  const noruolo=ruoliMancanti(st,day,curDate);
  if(noruolo.length){
    h+=`<section class="alert"><h2>${noruolo.length===1?"1 ruolo obbligatorio mancante":noruolo.length+" ruoli obbligatori mancanti"}</h2><div class="none" style="margin:-4px 0 6px">Chi ha quel ruolo e si potrebbe mettere. Con “Metti” entra in quel turno per la settimana; il programma poi riequilibra i numeri da solo.</div>`;
    for(const u of noruolo){
      const c=[], R=RUOLI[u.k], has=e=>haRuolo(e,u.k), fab2=fab;
      st.riserve.filter(e=>has(e)&&canRep(e,u.r.id)&&(turnoDi(e,mon)===u.t.id||fuoriTurnoOk(e,u.r.id,u.t.id,mon))).forEach(e=>c.push({e,from:"non utilizzati",why:turnoDi(e,mon)===u.t.id?"":"fuori dalla sua rotazione",ok:1}));
      for(const r2 of ana.reparti){ if(r2.id===u.r.id) continue;
        for(const t2 of ORD){ const l2=st.slots[r2.id][t2]; if(t2!==u.t.id && !l2.some(e=>fuoriTurnoOk(e,u.r.id,u.t.id,mon))) continue;
          const same=l2.filter(has), serve=ruoliRichiesti(r2,fab2[r2.id][t2]).includes(u.k);
          same.filter(e=>canRep(e,u.r.id)&&(t2===u.t.id||fuoriTurnoOk(e,u.r.id,u.t.id,mon))).forEach(e=>c.push({e,from:r2.nome+" "+turnoName(t2).toLowerCase(),
            why:(t2===u.t.id?"":"fuori dalla sua rotazione")+(serve&&same.length<2?(t2===u.t.id?"":"; ")+"lì resterebbe senza "+R.l:""), ok:!(serve&&same.length<2)&&t2===u.t.id})); } }
      c.sort((a,b)=>(b.ok?1:0)-(a.ok?1:0)||a.e.nome.localeCompare(b.e.nome));
      h+=`<div class="urg"><div class="t">${esc(u.r.nome)}, ${esc(u.t.nome.toLowerCase())} <span>${esc(sqLabel(u.t.id,mon))}: manca ${esc(R.l)}</span></div>`+
        (c.length? `<div class="cands">`+c.slice(0,5).map(k=>`<span class="cand ${k.ok?"":"nocomp"}"><span>${esc(k.e.nome)} <span class="from">da ${esc(k.from)}${k.why?", "+esc(k.why):""}</span></span><button class="btn small ${k.ok?"primary":""}" data-mv="${k.e.id}" data-to="${u.r.id}" data-tt="${u.t.id}">Metti</button></span>`).join("")+`</div>`
                  : `<div class="none">Nessuna persona con ruolo “${esc(R.l)}” abilitata a ${esc(u.r.nome)} in questo turno. Si può scrivere il ruolo nella scheda di chi lo fa, oppure abilitare a ${esc(u.r.nome)} qualcuno che ce l’ha.</div>`)+`</div>`;
    }
    h+=`</section>`;
  }
  h+=`<div class="board">`;
  for(const r of ana.reparti){
    let n=0, req=0, bad=false;
    let groups="";
    for(const t of ana.turni){
      const list=st.slots[r.id][t.id], nn=fab[r.id][t.id]; n+=list.length; req+=nn;
      if(!nn && !list.length) continue;
      const cls = list.length<nn ? "bad" : (nn>0 && list.length>nn) || (nn===0 && t.id!==GIORN) ? "over" : "ok"; if(list.length<nn) bad=true;
      groups+=`<div class="tg" data-rep="${r.id}" data-turno="${t.id}"><div class="tl">${esc(t.nome)} <span class="o">${esc(t.orario||"")}${t.orario?" · ":""}${esc(sqLabel(t.id,mon))}</span><span class="c ${cls}">${list.length}${nn?" / "+nn:""}</span></div><div class="list">`+
        list.map(e=>chipHtml(e,r.id,t.id,list)).join("")+
        (list.length<nn? `<div class="hole">${nn-list.length===1?"1 posto scoperto":(nn-list.length)+" posti scoperti"}</div>`:"")+`</div></div>`;
    }
    const nt=st.slots[r.id][NOTURNO];
    if(nt.length){ n+=nt.length; groups+=`<div class="tg" data-rep="${r.id}" data-turno="${NOTURNO}"><div class="tl">Squadra da assegnare<span class="c">${nt.length}</span></div><div class="list">`+nt.map(e=>chipHtml(e,r.id,NOTURNO)).join("")+`</div></div>`; }
    if(!groups) groups=`<div class="tg" data-rep="${r.id}" data-turno="${NOTURNO}"><div class="none">Nessun fabbisogno questa settimana</div></div>`;
    const s = bad ? "bad" : (req && n>=req ? "ok" : "warn");
    const lab = bad ? "Scoperto" : req ? "Coperto" : "Nessuna richiesta";
    const max=Math.max(req,n,1);
    h+=`<section class="rep ${bad?"bad":""}"><div class="h"><div class="name">${esc(r.nome)}${r.giornaliero?"<small>turno unico</small>":""}</div>
        <div class="num"><span class="big">${n}</span><span class="of">richiesti<br>${req}</span><span class="pill ${s}">${lab}</span></div>
        <div class="gauge" aria-hidden="true"><i style="width:${Math.min(100,n/max*100)}%;background:${bad?"var(--bad)":"var(--ok)"}"></i><u style="left:${req/max*100}%"></u></div></div>
      <div class="chips">${groups}</div></section>`;
  }
  h+=`</div>`;

  if(st.senza.length){
    h+=`<section class="absent"><div class="h"><b>Senza reparto</b><span class="none">${st.senza.length} da completare: indica il reparto nella scheda</span></div><div class="chips">`+st.senza.map(e=>`<button class="chip" data-emp="${e.id}" draggable="true">${esc(e.nome)}</button>`).join("")+`</div></section>`;
  }
  h+=`<section class="absent" data-drop="__ris"><div class="h"><b>Addetti non utilizzati</b><span class="none">${st.riserve.length? st.riserve.length+" presenti senza un posto nel proprio turno: trascinali dove servono":"nessuno"}</span></div><div class="chips">`+
    st.riserve.map(e=>`<button class="chip" data-emp="${e.id}" draggable="true"><span class="sqb">${esc(sqTag(e))}</span>${esc(e.nome)}<span class="tag">${esc(repName(e.reparto))}</span></button>`).join("")+`</div></section>`;
  h+=`<section class="absent" data-drop="__abs"><div class="h"><b>Assenti</b><span class="none">${st.assenti.length? st.assenti.length+" questa settimana" : "nessuno. Per segnare un’assenza tocca un nome o trascinalo qui"}</span></div><div class="chips">`+
    st.assenti.map(e=>{ const a=day.assenze[e.id], t=tipo(a.tipo);
      return `<button class="chip ${t.urg?"urgent":""}" data-emp="${e.id}"><span class="sqb">${esc(sqTag(e))}</span>${esc(e.nome)}<span class="tag">${esc(t.l)}${a.nota?": "+esc(a.nota):""} (${esc(repName(e.reparto))})</span></button>`; }).join("")+
    `</div></section>
    <div class="legend"><span class="lm">fuori dal reparto principale</span><span class="la">assenza non programmata</span><span class="ln">Lettera nel riquadro = squadra del suo reparto (G = turno unico giornaliero, J = jolly senza squadra). ! = reparto o turno diverso da quelli della persona, oppure manca il collega con cui deve lavorare.</span><span class="ln">Tocca un nome per aprire la scheda. Da computer puoi trascinarlo su un turno.</span></div>`;

  $("main").innerHTML=h;
  $("rst").onclick=resetMoves; $("prt").onclick=()=>{ location.hash="#stampa"; };
  $("prep").onclick=()=>preparaSettimana();
  bindSqBar(mon);
  $("needW").ontoggle=ev=>{ renderNeed.openW=ev.target.open; };
  $("stdSave").onclick=()=>{ const f=fabSett(mon); ana.reparti.forEach(r=>r.std=Object.assign({},r.std,f[r.id])); save("dati/anagrafica", ana); toast("Fabbisogno salvato come standard per le prossime settimane"); };
  $("stdLoad").onclick=()=>{ week.fabbisogno=null; saveWeek(); render(); autoRicalcolo(); };
  document.querySelectorAll("input[data-nr]").forEach(inp=>inp.onchange=()=>{
    const f=fabSett(mon); f[inp.dataset.nr][inp.dataset.nt]=Math.max(0,parseInt(inp.value,10)||0); week.fabbisogno=f; saveWeek(); render(); autoRicalcolo();
  });
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>assign(b.dataset.mv,b.dataset.to,b.dataset.tt));
  document.querySelectorAll(".chip[data-emp]").forEach(b=>{
    b.onclick=()=>openEmp(b.dataset.emp);
    b.ondragstart=ev=>{ ev.dataTransfer.setData("text/plain",b.dataset.emp); ev.dataTransfer.effectAllowed="move"; };
  });
  document.querySelectorAll(".tg[data-rep]").forEach(sec=>{
    sec.ondragover=ev=>{ ev.preventDefault(); sec.classList.add("drop"); };
    sec.ondragleave=()=>sec.classList.remove("drop");
    sec.ondrop=ev=>{ ev.preventDefault(); sec.classList.remove("drop"); const id=ev.dataTransfer.getData("text/plain"); if(id) assign(id, sec.dataset.rep, sec.dataset.turno); };
  });
  document.querySelectorAll("[data-drop]").forEach(sec=>{
    sec.ondragover=ev=>ev.preventDefault();
    sec.ondrop=ev=>{ ev.preventDefault(); const id=ev.dataTransfer.getData("text/plain"); if(!id) return; if(sec.dataset.drop==="__abs") openEmp(id,true); else assign(id,"__ris"); };
  });
}

/* ---------- vista settimana ---------- */
function sqBarHtml(mon){
  const rot=rotFor(mon);
  let sq=`<div class="sqbar">`+SQUADRE.map(s=>{ const n=ana.dipendenti.filter(e=>sqEff(e)===s).length;
      return `<div class="sqc"><div class="l">Squadra ${s}</div><div class="t">${esc(turnoName(rot[s]))} ${esc((turnoById(rot[s])||{}).orario||"")}</div><div class="n">${n} persone</div></div>`; }).join("")+
    `<div class="sqc"><div class="l">Giornaliero</div><div class="t">Turno unico${(turnoById(GIORN)||{}).orario?" "+esc(turnoById(GIORN).orario):""}</div><div class="n">${ana.dipendenti.filter(e=>sqEff(e)==="G").length} persone, non in squadra</div></div>`+
    `<div class="rotbox noprint"><label for="rotA"><b>Squadra A in questa settimana</b></label><select id="rotA">${ORD.map(t=>`<option value="${t}" ${rot.A===t?"selected":""}>${esc(turnoName(t))}</option>`).join("")}</select>
      <span class="none">B e C seguono. Ogni settimana si passa a</span><select id="rotP"><option value="1" ${rotBase().passo===1?"selected":""}>mattina → pomeriggio → notte</option><option value="2" ${rotBase().passo===2?"selected":""}>pomeriggio → mattina → notte</option></select>
      ${rotManual(mon)?`<span class="mod">modificata a mano per questa settimana</span><button class="btn small" id="rotReset">Ripristina</button>`:""}</div>`+
    ana.reparti.filter(r=>r.turniVariabili&&!r.giornaliero).map(r=>`<div class="rotbox noprint"><label for="ntr-${r.id}"><b>${esc(r.nome)}</b> in questa settimana lavora su</label><select id="ntr-${r.id}" data-ntr="${r.id}">${[1,2,3].map(n=>`<option value="${n}" ${nTurniRep(r,mon)===n?"selected":""}>${TURNI_N_LAB[n]}</option>`).join("")}</select></div>`).join("")+`</div>`;
  return sq;
}
function bindSqBar(mon){
  const rot=rotFor(mon), renderWeek=render;
  $("rotA").onchange=async ev=>{
    const A=ev.target.value; ev.target.blur();

      ana.rotazione=Object.assign({},rotBase(),{rif:mon,A}); saveAna(); week.rotazione=null; saveWeek();
    } else { week.rotazione=nuova; saveWeek(); autoRicalcolo(); }

  };

  if($("rotReset")) $("rotReset").onclick=()=>{ week.rotazione=null; saveWeek(); renderWeek(); autoRicalcolo(); };
}

function sqOptions(e){

  const v=e.squadra||"";
  return `<option value="" ${v===""?"selected":""}>Nessuna (jolly, va in qualsiasi squadra)</option>`+SQUADRE.map(s=>`<option value="${s}" ${v===s?"selected":""}>Squadra ${s}</option>`).join("")+`<option value="G" ${v==="G"?"selected":""}>G · turno unico giornaliero, non in squadra</option>`;
}
function repOptions(e){ return `<option value="" ${repById(e.reparto)?"":"selected"}>— da indicare</option>`+ana.reparti.map(r=>`<option value="${r.id}" ${r.id===e.reparto?"selected":""}>${esc(r.nome)}</option>`).join(""); }
function ruoliList(){ const s=[...new Set(ana.dipendenti.map(e=>(e.ruolo||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b)); return `<datalist id="ruoli">${s.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`; }
function ticksHtml(e){

      return `<label class="${base?"dis":""}"><input type="checkbox" data-crep="${r.id}" ${canRep(e,r.id)?"checked":""} ${base?"disabled":""}>${esc(r.nome)}${base?" (principale)":""}</label>`; }).join("")+`</div>`;
}
function coppieHtml(e){
  const reps=ana.reparti.filter(r=>canRep(e,r.id)); if(!reps.length) return "";
  return `<h4>Solo insieme a</h4><div class="none" style="margin-bottom:6px">Se in un reparto può lavorare solo accanto a certi colleghi, scegli qui con chi: verrà messo in quel reparto solo nel turno in cui c’è almeno uno di loro. Senza nomi lavora con chiunque.</div><div class="asg">`+
    reps.map(r=>{ const p=partnersOf(e,r.id), cand=ana.dipendenti.filter(x=>x.id!==e.id && !p.includes(x.id) && canRep(x,r.id)).sort((a,b)=>a.nome.localeCompare(b.nome));
      return `<span class="rn">${esc(r.nome)}</span><div class="grid-btn" style="align-items:center">`+
        p.map(id=>`<span class="cand" style="padding:2px 4px 2px 8px">${esc(empById(id).nome)} <button class="btn small" data-cdel="${r.id}|${id}" aria-label="Togli ${esc(empById(id).nome)}">✕</button></span>`).join("")+
        `<select data-cadd="${r.id}" style="max-width:190px"><option value="">${p.length?"+ aggiungi un altro":"con chiunque · scegli…"}</option>${cand.map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></div>`; }).join("")+`</div>`;
}
function coppieTxt(e){ return Object.keys(e.coppie||{}).filter(r=>repById(r)&&partnersOf(e,r).length).map(r=>repName(r)+" solo con "+nomiPartner(e,r)).join("; "); }
function bindTicks(root, e, after){
  root.querySelectorAll("[data-crep]").forEach(c=>c.onchange=()=>{ const r=c.dataset.crep; e.competenze=e.competenze.filter(x=>x!==r); if(c.checked) e.competenze.push(r); saveAna(); after&&after(); });

          <button class="btn danger" id="assente">Conferma assenza</button>`)+`</div>`+
    ticksHtml(e)+coppieHtml(e)+

  if(!a && !wk){

  }
  h+=`<div class="row" style="margin-top:12px"><label for="nn">Note</label><input type="text" id="nn" value="${esc(e.note||"")}" style="flex:1"></div>

  const body=$("dlgBody"); body.innerHTML=h;
  const dlg=$("dlg"); if(!dlg.open) dlg.showModal();
  $("chiudi").onclick=()=>dlg.close();

  $("esq").onchange=ev=>{ e.squadra=ev.target.value; saveAna(); render(); openEmp(id); };
  if($("esp")) $("esp").onchange=ev=>{ e.sqPref=ev.target.value; delete week.jolly[id]; if(week.jollyMan) delete week.jollyMan[id]; saveWeek(); saveAna(); render(); openEmp(id); };
